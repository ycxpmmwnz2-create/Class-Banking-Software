
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Morgan's Class Cash</title>

  <style>
    :root {
      --bg: #cdebe7;
      --card: #dff3f0;
      --text: #12323a;
      --muted: #5f7780;
      --line: #a9d3cf;
      --teal: #5ec7c2;
      --teal-dark: #238f8c;
      --mint: #b8ebd0;
      --sky: #c7e9f9;
      --coral: #ffb4a2;
      --shadow: 0 16px 40px rgba(18, 50, 58, 0.10);
      --shadow-soft: 0 8px 22px rgba(18, 50, 58, 0.08);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(94, 199, 194, 0.42), transparent 34%),
        radial-gradient(circle at top right, rgba(163, 218, 218, 0.80), transparent 32%),
        linear-gradient(180deg, #dff3f0 0%, var(--bg) 100%);
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    h1, h2, h3 { letter-spacing: -0.03em; }
    h1 { margin: 0; font-size: clamp(32px, 4vw, 54px); line-height: 1; }
    h2 { margin: 0 0 14px; font-size: 25px; }
    h3 { margin: 18px 0 10px; font-size: 17px; }

    #app {
      width: 100%;
      min-width: 0;
      max-width: 1400px;
      margin: 0 auto;
    }

    .hero {
      background: linear-gradient(135deg, rgba(94, 199, 194, 0.96), rgba(199, 233, 249, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius-lg);
      padding: 26px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      right: -70px;
      top: -90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.36);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1.2fr auto;
      gap: 20px;
      align-items: center;
    }

    .center-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin-bottom: 18px;
    }

    .center-logo {
      width: min(360px, 82vw);
      height: auto;
      display: block;
      opacity: 0.96;
      border-radius: 18px;
    }




    .tagline {
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 800;
      color: rgba(18, 50, 58, 0.78);
    }

    .hero-badge {
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.72);
      border-radius: 999px;
      padding: 12px 16px;
      font-weight: 900;
      color: var(--teal-dark);
      box-shadow: var(--shadow-soft);
      white-space: nowrap;
    }

    .message {
      background: rgba(211, 238, 233, 0.98);
      border: 1px solid rgba(216, 231, 236, 0.9);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      font-weight: 800;
      margin-bottom: 16px;
      box-shadow: var(--shadow-soft);
    }

    .button-bar, .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    button {
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #dff3f0;
      cursor: pointer;
      font-weight: 800;
      color: var(--text);
      box-shadow: 0 3px 10px rgba(18, 50, 58, 0.05);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
      background: #d4eeea;
    }

    .primary {
      border: 0;
      background: var(--teal-dark);
      color: white;
      margin-top: 6px;
    }

    .danger {
      border: 0;
      background: #fee2e2;
      color: #991b1b;
      margin-left: 6px;
    }

    .approve {
      border: 0;
      background: #dcfce7;
      color: #166534;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid rgba(216, 231, 236, 0.9);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-soft);
      font-weight: 950;
      font-size: 20px;
    }

    .dashboard-insights {
      padding: 14px 16px;
      margin-bottom: 12px;
    }

    .dashboard-insights h2 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .dashboard-insights .stats {
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 0;
    }

    .dashboard-insights .stat-box {
      display: flex;
      align-items: center;
      min-height: 54px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      box-shadow: 0 3px 10px rgba(18, 50, 58, 0.05);
      font-size: 15px;
      line-height: 1.25;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 16px;
    }

    .wide-grid {
      display: grid;
      grid-template-columns: minmax(340px, 0.9fr) minmax(440px, 1.4fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .grid > *,
    .wide-grid > * {
      min-width: 0;
    }

    .card {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      background: #dff3f0;
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(216, 231, 236, 0.9);
      box-shadow: var(--shadow-soft);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      backdrop-filter: blur(10px);
    }

    .soft-card {
      background: linear-gradient(135deg, #eaf8f6, #d3eee9);
    }

    input, select, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      font-size: 16px;
      font-family: inherit;
      background: #dff3f0;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus {
      outline: 3px solid rgba(94, 199, 194, .25);
      border-color: var(--teal);
    }

    textarea { min-height: 130px; resize: vertical; }

    label {
      display: block;
      font-weight: 900;
      margin-bottom: 6px;
      color: #29464e;
    }


    .settings-list {
      display: grid;
      gap: 8px;
      margin: 10px 0 18px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(200, 223, 223, 0.62);
      font-weight: 900;
      color: #29464e;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-text {
      line-height: 1.25;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 30px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #cbd5d6;
      transition: .18s;
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px rgba(18, 50, 58, 0.06);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 3px;
      bottom: 3px;
      background: #ffffff;
      transition: .18s;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(18, 50, 58, 0.20);
    }

    .switch input:checked + .slider {
      background: var(--teal-dark);
    }

    .switch input:checked + .slider:before {
      transform: translateX(22px);
    }


    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(243, 251, 250, 0.72);
      border: 1px solid var(--line);
      padding: 8px;
      border-radius: 18px;
      margin-bottom: 14px;
    }

    .segment-button {
      border: 0;
      box-shadow: none;
      background: transparent;
      color: var(--text);
      border-radius: 14px;
    }

    .segment-button.active {
      background: var(--teal-dark);
      color: white;
    }

    .teacher-choice-memo {
      display: none;
    }

    .teacher-choice-memo.visible {
      display: block;
    }

    .login-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background-color: rgba(244, 248, 251, 0.82);
      padding: 8px;
      border-radius: 18px;
      margin-bottom: 16px;
    }

    .active-tab {
      border: 0;
      background: var(--teal-dark);
      color: white;
      font-weight: 900;
    }

    .inactive-tab {
      background-color: #dff3f0;
      font-weight: 900;
    }

    .quick-cash-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0;
    }

    .quick-btn {
      border: 0;
      border-radius: 18px;
      font-size: 22px;
      padding: 18px 8px;
      color: var(--text);
      background: var(--mint);
    }

    .quick-btn.subtract {
      background: var(--coral);
      color: var(--text);
    }

    .balance-card {
      background: linear-gradient(135deg, rgba(94, 199, 194, 0.96), rgba(199, 233, 249, 0.94));
      border: 1px solid rgba(255,255,255,.75);
      border-radius: var(--radius-lg);
      padding: 24px;
      box-shadow: var(--shadow-soft);
      margin-bottom: 16px;
    }

    .big-balance {
      font-size: clamp(42px, 8vw, 70px);
      font-weight: 950;
      letter-spacing: -0.07em;
      margin: 8px 0;
    }

    .pending-balance {
      font-size: 18px;
      margin-bottom: 8px;
      font-weight: 800;
      color: rgba(18, 50, 58, 0.76);
    }

    .small-note {
      font-size: 13px;
      color: var(--muted);
      margin-top: 8px;
      line-height: 1.35;
    }

    .link-button {
      display: inline-block;
      margin-top: 10px;
      padding: 4px 2px;
      border: 0;
      background: none;
      box-shadow: none;
      color: var(--teal-dark);
      font-weight: 600;
      font-size: 13px;
      text-decoration: underline;
      text-underline-offset: 2px;
      cursor: pointer;
    }

    .link-button:hover {
      transform: none;
      box-shadow: none;
      background: none;
      color: var(--text);
    }

    .empty, .lock-note, .purchase-note, .backup-reminder {
      padding: 14px;
      border-radius: var(--radius-md);
      font-weight: 800;
      margin-bottom: 12px;
      border: 1px solid rgba(216, 231, 236, 0.9);
    }

    .empty {
      background-color: rgba(211, 238, 233, 0.94);
      border: 1px dashed #bdd2da;
      color: var(--muted);
    }

    .lock-note {
      background-color: #ecfeff;
      color: #164e63;
    }

    .purchase-note {
      background-color: #f0fdf4;
      color: #14532d;
    }

    .backup-reminder {
      background-color: #fffbeb;
      color: #78350f;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 860px;
      overflow: hidden;
      border-radius: 16px;
    }

    th {
      text-align: left;
      padding: 10px;
      background-color: rgba(199, 233, 249, 0.55);
      color: #29464e;
      font-size: 13px;
      text-transform: uppercase;
      letter-spacing: .05em;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid rgba(216, 231, 236, 0.82);
      vertical-align: top;
      font-weight: 650;
    }

    .roster-row {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr 0.7fr auto;
      gap: 8px;
      align-items: flex-end;
      padding: 12px;
      border: 1px solid rgba(216, 231, 236, 0.9);
      border-radius: 18px;
      margin-bottom: 10px;
      background: rgba(211, 238, 233, 0.96);
    }
    
    .roster-row input {
      margin-bottom: 0;
    }

    .activity-list {
      display: grid;
      gap: 10px;
    }

    .activity-item {
      background: rgba(211, 238, 233, 0.94);
      border: 1px solid rgba(216, 231, 236, 0.82);
      border-radius: 16px;
      padding: 12px;
    }

    .activity-title {
      font-weight: 950;
      margin-bottom: 4px;
    }

    .activity-sub {
      color: var(--muted);
      font-size: 14px;
      font-weight: 700;
    }


    .student-transaction-list {
      display: grid;
      gap: 10px;
    }

    .student-transaction-card {
      background: rgba(243, 251, 250, 0.74);
      border: 1px solid rgba(169, 211, 207, 0.82);
      border-radius: 16px;
      padding: 12px;
    }

    .student-transaction-top {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 6px;
    }

    .student-transaction-title {
      font-weight: 950;
      font-size: 16px;
      color: var(--text);
    }

    .student-transaction-amount {
      font-weight: 950;
      font-size: 18px;
      white-space: nowrap;
    }

    .student-transaction-meta {
      font-size: 13px;
      color: var(--muted);
      font-weight: 750;
      line-height: 1.35;
    }

    .status-pill {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 900;
      margin-left: 6px;
      background: #dff3f0;
      color: var(--teal-dark);
    }

    .print-only { display: none; }

    @media print {
      body { background: #dff3f0; padding: 16px; }
      .no-print { display: none !important; }
      .print-only { display: block; }
      .card { border: none; padding: 0; box-shadow: none; }
      table { min-width: 0; font-size: 14px; }
      th, td { border: 1px solid #999; }
    }

    @media (max-width: 1000px) {
      .stats { grid-template-columns: repeat(2, 1fr); }
      .dashboard-insights .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .grid { grid-template-columns: minmax(0, 1fr); }
      .wide-grid { grid-template-columns: 1fr; }
      .hero-content { grid-template-columns: 1fr; }
      .roster-row { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .roster-row .no-print {
        grid-column: 1 / -1;
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .roster-row .no-print .small-note { flex-basis: 100%; }
      .roster-row .no-print button {
        flex: 1 1 120px;
        margin: 0;
      }
    }

    @media (max-width: 700px) {
      html, body {
        max-width: 100%;
        overflow-x: hidden;
      }

      body { padding: 12px; }
      h1 { font-size: 30px; }
      h2 { font-size: 21px; margin-bottom: 10px; }
      .hero {
        padding: 16px;
        margin-bottom: 12px;
        border-radius: 20px;
      }
      .hero-content { gap: 12px; }
      .hero-badge {
        white-space: normal;
        text-align: center;
      }
      .center-logo { width: min(300px, 86vw); }
      .brand-mark { width: 40px; height: 40px; }
      .brand-name { font-size: 18px; }
      .button-bar {
        gap: 8px;
        margin-bottom: 12px;
      }
      .button-bar > button {
        flex: 1 1 calc(50% - 4px);
        min-height: 44px;
      }
      .transaction-export-buttons > button { flex-basis: 100%; }
      .grid {
        grid-template-columns: minmax(0, 1fr);
        gap: 12px;
      }
      .wide-grid {
        gap: 12px;
        margin-bottom: 12px;
      }
      .card {
        padding: 14px;
        border-radius: 20px;
      }
      .stats { grid-template-columns: 1fr; }
      .dashboard-insights .stats { grid-template-columns: 1fr; }
      .dashboard-insights { padding: 12px; }
      .dashboard-insights .stat-box { min-height: 48px; }
      .quick-cash-grid {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 8px;
      }
      .quick-btn {
        min-height: 54px;
        padding: 12px 4px;
        font-size: 19px;
      }
      .roster-row {
        grid-template-columns: minmax(0, 1fr);
        gap: 6px;
        padding: 10px;
      }
      .roster-row input { margin-bottom: 4px; }
      .roster-row .no-print button {
        flex: 1 1 calc(50% - 3px);
        margin: 0;
      }
      .transaction-filter-controls,
      .profile-navigation {
        width: 100%;
        max-width: none !important;
      }
      .profile-navigation button { width: 100%; }
      .student-profile-card .balance-card {
        padding: 18px;
        border-radius: 20px;
      }
      .student-profile-card .stat-box {
        padding: 12px;
        font-size: 16px;
      }
      .student-transaction-top {
        align-items: flex-start;
        flex-wrap: wrap;
      }
      table { min-width: 720px; }
      .danger { margin-left: 0; margin-top: 6px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <script type="module">
import { app, auth, db, functions, connectPhase2bEmulatorsIfConfigured } from "./src/firebase/firebase.js";
import { browserSessionPersistence, GoogleAuthProvider, linkWithPopup, onAuthStateChanged, setPersistence, signInWithCustomToken, signInWithEmailAndPassword, signInWithPopup, signOut } from "firebase/auth";
import { collection, doc, getDoc, getDocs, limit, orderBy, query, setDoc } from "firebase/firestore";
import { httpsCallable } from "firebase/functions";
import { TenantSession, SESSION_STATES, resetGlobalApplicationState } from "./src/phase2b/tenantSession.js";
import { readTeacherCache, writeTeacherCache, purgeTenantCache, purgeLegacyCache, MultiTabInvalidator, buildCacheKey } from "./src/phase2b/tenantCache.js";
import { mapSafeClientError, orchestrateProductionLogout, orchestrateTeacherResolution, orchestrateTeacherOnboarding, handleAuthTransition, loadClassroomDataWithCacheFallback, orchestrateClassroomDataSave, orchestrateAuthLogsFetch, orchestrateStudentPinReset, orchestrateBulkOperation, safeExecuteWithEpochCheck } from "./src/phase2b/tenantClient.js";

const IS_MULTI_TEACHER_V2_ENABLED = import.meta.env.VITE_MULTI_TEACHER_V2_ENABLED === "true";
    const STORAGE_KEY = "mrMorganClassCashDataV5";
    const TEACHER_UID = "YkYUzIzy0aW7roolM1VaLcIJPuN2";
    const defaultSettings = {
      studentRequestsEnabled: true,
      studentAddRequestsEnabled: true,
      studentSubtractRequestsEnabled: true,
      purchaseRequestsEnabled: true,
      requireTeacherApproval: true,
      reasons: [
        "Weekly payday",
        "Class job",
        "Showing work",
        "Desk rent",
        "Bathroom break",
        "Bonus",
        "Other"
      ],
      purchaseCategories: [
        "School Store",
        "Road Runner Tickets",
        "Other"
      ],
      addMoneyCategories: [
        "Homework",
        "Class Job",
        "Positive Consequence",
        "Going Above and Beyond",
        "Showing Work",
        "Earned Class Cash in Specials",
        "Teacher's Choice"
      ],
      subtractMoneyCategories: [
        "Rent",
        "Restroom",
        "Class Store Purchase",
        "Roadrunner Ticket Purchase",
        "Negative Consequence",
        "Bad Language (Swearing, Racial Slurs, Etc...)",
        "Teacher's Choice"
      ]
    };

    const defaultData = {
      students: [],
      transactions: [],
      loginHistory: [],
      settings: defaultSettings,
      lastBackupAt: null
    };

    let data = cloneDefault();
    let screen = "login";
    let loginTab = "teacher";
    let showTeacherPasswordLogin = false;
    let isTeacher = false;
    let loggedInStudentId = null;
    let teacherProfileStudentId = null;
    let message = "";
    let studentLoginIdDraft = "";
    let studentLoginPending = false;
    let studentAuthLogs = [];
    let studentAuthLogsLoading = false;
    let studentAuthLogsError = "";
    let studentPinResetPending = false;
    let bulkOperationPending = false;
    let resolvedClassroom = null;
    let resolvedTeacher = null;
    let v2IsOffline = false;

    function requireTeacher() {
      if (IS_MULTI_TEACHER_V2_ENABLED) {
        return v2TenantSession.requireTeacher(auth.currentUser?.uid);
      }
      const hasTeacherAccess = isTeacher && auth.currentUser?.uid === TEACHER_UID;
      if (!hasTeacherAccess) {
        console.warn("Teacher authentication required.");
      }
      return hasTeacherAccess;
    }

    // Phase 1B: additive wiring for the new teachers/classrooms foundation.
    // Only the existing authorized teacher may provision. The client has no
    // read access to the new `teachers` collection (no Firestore rule grants
    // it, and rules are not being changed in this phase), so the existence
    // check and the provisioning itself both happen server-side inside the
    // idempotent ensureTeacherClassroom callable. Nothing here affects
    // morganBank/classroomData, `data`, `screen`, or `message`.
    async function ensureTeacherClassroomProfile(uid) {
      if (uid !== TEACHER_UID) return;
      try {
        const ensureTeacherClassroom = httpsCallable(functions, "ensureTeacherClassroom");
        await ensureTeacherClassroom();
      } catch (error) {
        console.error("Teacher/classroom provisioning check failed:", error);
      }
    }

    function cloneDefault() {
      return JSON.parse(JSON.stringify(defaultData));
    }

    function normalizeData(parsed) {
      return {
        students: Array.isArray(parsed.students)
          ? parsed.students.map(student => ({ ...student, frozen: Boolean(student.frozen) }))
          : [],
        transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],
        loginHistory: Array.isArray(parsed.loginHistory) ? parsed.loginHistory.slice(0, 500) : [],
        settings: {
          ...defaultSettings,
          ...(parsed.settings || {}),
          reasons: Array.isArray(parsed.settings?.reasons) ? parsed.settings.reasons : defaultSettings.reasons,

function exportTransactionsCsv(scope) {
  if (!requireTeacher()) return;

  const today = new Date().toDateString();
  const transactions = scope === "today"
    ? data.transactions.filter(transaction => new Date(transaction.date).toDateString() === today)
    : scope === "current"
      ? filteredTeacherTransactions()
      : data.transactions;

  if (transactions.length === 0) {
    showMessage("No transactions to export.");
    return;
  }

  const csvCell = value => {
    let text = String(value ?? "");
    if (/^[=+\-@]/.test(text)) text = "'" + text;
    return `"${text.replaceAll('"', '""')}"`;
  };

  const headers = [
    "Date",
    "Time",
    "Student",
    "Type",
    "Amount",
    "Category/Reason",
    "Status",
    "Created By",
    "Memo/Note"
  ];

  const rows = transactions.map(transaction => {
    const timestamp = new Date(transaction.date);
    const hasValidTimestamp = !Number.isNaN(timestamp.getTime());

    return [
      hasValidTimestamp ? timestamp.toLocaleDateString() : transaction.date || "",
      hasValidTimestamp ? timestamp.toLocaleTimeString() : "",
      transaction.studentName,
      transaction.type,
      transaction.amount,
      transaction.category || transaction.reason,
      transaction.status,
      transaction.source,
      transaction.memo || transaction.note || ""
    ].map(csvCell).join(",");
  });

  const csv = "\uFEFF" + [headers.map(csvCell).join(","), ...rows].join("\r\n");
  const blob = new Blob([csv], { type: "text/csv;charset=utf-8" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `morgan-bank-transactions-${scope}-${new Date().toISOString().slice(0, 10)}.csv`;
  link.click();
  URL.revokeObjectURL(url);
}

          classroomId: "morgan",

        });

    function submitStudentRequest() {
      const student = currentStudent();
      if (!student) return;

      if (student.frozen) {
        showMessage("This account is frozen. Please see Mr. Morgan.");
        return;
      }

      if (!data.settings.studentRequestsEnabled) {
        showMessage("Student requests are currently turned off.");
        return;
      }

      const type = document.getElementById("studentRequestType").value;
      const amount = Number(document.getElementById("studentRequestAmount").value);
      const reason = document.getElementById("studentRequestReason").value;

      if (type === "Add" && !data.settings.studentAddRequestsEnabled) {
        showMessage("Add-money requests are currently turned off.");
        return;
      }

      if (type === "Subtract" && !data.settings.studentSubtractRequestsEnabled) {
        showMessage("Spend-money requests are currently turned off.");
        return;
      }

      if (!amount || amount <= 0) {
        showMessage("Enter an amount greater than 0.");
        return;
      }

      if (type === "Subtract" && amount > Number(student.balance)) {
        showMessage("That payment is more than your approved balance.");
        return;
      }

      const shouldBePending = type === "Add";

      const newTransaction = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        studentId: student.id,
        studentName: student.name,
        type,
        amount,
        reason,
        memo: "",
        category: "",
        status: shouldBePending ? "Pending" : "Approved",
        source: "Student"
      };

      if (!shouldBePending) {
        changeStudentBalance(student.id, type, amount);
      }

      data.transactions = [newTransaction].concat(data.transactions);
      saveData();
      message = shouldBePending
        ? "Credit request submitted for teacher approval."
        : "Payment submitted and approved.";
      render();
    }

      const category = document.getElementById("purchaseCategory").value;
      const memo = document.getElementById("purchaseMemo").value.trim();
      const amount = Number(document.getElementById("purchaseAmount").value);

      if (!amount || amount <= 0) {
        showMessage("Enter a purchase amount greater than 0.");
        return;
      }

      if (amount > Number(student.balance)) {
        showMessage("That purchase is more than your approved balance. Ask Mr. Morgan if you think that is wrong.");
        return;
      }

      const newTransaction = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        studentId: student.id,
        studentName: student.name,
        type: "Subtract",
        amount,
        reason: "Purchase: " + category,
        memo,
        category,
        status: "Approved",
        source: "Student Purchase"
      };

      changeStudentBalance(student.id, "Subtract", amount);
      data.transactions = [newTransaction].concat(data.transactions);
      saveData();
      message = "Purchase submitted and approved. Money has been subtracted.";
      render();
    }

    function approveAllCreditRequests() {
      if (!requireTeacher()) return;
      const pendingCredits = data.transactions.filter(transaction =>
        transaction.status === "Pending" && transaction.type === "Add"
      );

      if (pendingCredits.length === 0) {
        showMessage("No pending credit requests to approve.");
        return;
      }

      const confirmed = confirm("Approve all pending credit requests?");
      if (!confirmed) return;

      pendingCredits.forEach(transaction => {
        changeStudentBalance(transaction.studentId, "Add", Number(transaction.amount));
      });

      const pendingCreditIds = new Set(pendingCredits.map(transaction => transaction.id));

      data.transactions = data.transactions.map(transaction => {
        if (pendingCreditIds.has(transaction.id)) {
          return { ...transaction, status: "Approved" };
        }
        return transaction;
      });

      saveData();
      message = pendingCredits.length + " credit request(s) approved.";
      render();
    }

    function approveTransaction(transactionId) {
      if (!requireTeacher()) return;
      const transaction = data.transactions.find(item => item.id === transactionId);
      if (!transaction || transaction.status !== "Pending") return;

      const student = data.students.find(item => item.id === transaction.studentId);
      if (!student) {
        showMessage("Student no longer exists on the roster.");
        return;
      }

      if (transaction.type === "Subtract" && Number(transaction.amount) > Number(student.balance)) {
        const confirmed = confirm("This approval would make " + student.name + "'s balance negative. Approve anyway?");
        if (!confirmed) return;
      }

      changeStudentBalance(transaction.studentId, transaction.type, transaction.amount);

      data.transactions = data.transactions.map(item => {
        if (item.id === transactionId) return { ...item, status: "Approved" };
        return item;
      });

      saveData();
      message = "Transaction approved.";
      render();
    }

    function denyTransaction(transactionId) {
      if (!requireTeacher()) return;
      data.transactions = data.transactions.map(item => {
        if (item.id === transactionId) return { ...item, status: "Denied" };
        return item;
      });

      saveData();
      message = "Transaction denied.";
      render();
    }

    async function activateStudent(studentIdStr) {
      if (!requireTeacher()) return;
      const student = data.students.find(s => String(s.id) === studentIdStr);
      if (!student) return;

      const newPin = prompt(`Enter a new 4-digit PIN for ${student.name}:`);
      if (!newPin) return;
      if (!/^\d{4}$/.test(newPin)) {
        alert("PIN must be exactly 4 digits.");
        return;
      }

      message = `Activating account for ${student.name}...`;
      render();

      if (IS_MULTI_TEACHER_V2_ENABLED) {
        const captured = v2TenantSession.captureIdentity();
        const resetFn = async (p) => {
          const resetStudentPin = httpsCallable(functions, "resetStudentPinV2");
          return await resetStudentPin(p);
        };
        const payload = {
          studentId: String(student.id),
          newPin
        };
        const res = await orchestrateStudentPinReset(v2TenantSession, resetFn, payload);
        if (!v2TenantSession.validateCapturedIdentity(captured)) return;

        if (res.executed) {
          student.credentialActive = true;
          await saveData();
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = `Account activated for ${student.name}.`;
            render();
          }
        } else {
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = res.error
              ? `Failed to activate ${student.name}: ${res.error}`
              : `Failed to activate ${student.name}.`;
            render();
          }
        }
        return;
      }

      try {
        const resetStudentPin = httpsCallable(functions, "resetStudentPin");
        await resetStudentPin({
          classroomId: "morgan",
          studentId: String(student.id),
          newPin
        });
        student.credentialActive = true;
        saveData();
        message = `Account activated for ${student.name}.`;
      } catch (error) {
        console.error("Activation failed:", error);
        message = `Failed to activate ${student.name}: ${error.message}`;
      }
      render();
    }

    async function bulkActivateStudents() {
      if (!requireTeacher() || bulkOperationPending) return;
      const checkboxes = Array.from(document.querySelectorAll(".bulk-activate-check:checked"));
      if (checkboxes.length === 0) {
        alert("Please select at least one inactive student.");
        return;
      }

      const newPin = document.getElementById("bulkActivatePin")?.value ?? "";
      if (!/^\d{4}$/.test(newPin)) {
        alert("PIN must be exactly 4 digits.");
        return;
      }

      bulkOperationPending = true;
      message = `Activating ${checkboxes.length} accounts...`;
      render();

      if (IS_MULTI_TEACHER_V2_ENABLED) {
        const captured = v2TenantSession.captureIdentity();
        const bulkFn = async (p, cap) => {
          const resetStudentPin = httpsCallable(functions, "resetStudentPinV2");
          const successfulStudentIds = [];
          let failCount = 0;
          for (const cb of p.checkboxes) {
            if (!v2TenantSession.validateCapturedIdentity(cap)) break;
            const studentId = cb.value;
            const student = data.students.find(s => String(s.id) === studentId);
            if (student) {
              try {
                await resetStudentPin({
                  studentId: String(student.id),
                  newPin: p.newPin
                });
                if (v2TenantSession.validateCapturedIdentity(cap)) {
                  successfulStudentIds.push(String(student.id));
                }
              } catch (error) {
                console.error("Failed to activate student", student.name, error);
                failCount++;
              }
            }
          }
          return { successfulStudentIds, failCount };
        };

        const res = await orchestrateBulkOperation(v2TenantSession, bulkFn, { checkboxes, newPin });
        if (!v2TenantSession.validateCapturedIdentity(captured)) return;

        if (res.executed && res.result) {
          const { successfulStudentIds, failCount } = res.result;
          for (const sId of successfulStudentIds) {
            const s = data.students.find(st => String(st.id) === sId);
            if (s) s.credentialActive = true;
          }
          await saveData();
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = `Bulk activation complete. ${successfulStudentIds.length} succeeded, ${failCount} failed.`;
            bulkOperationPending = false;
            render();
          }
        } else {
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = res.error || "Bulk activation cancelled or session invalidated.";
            bulkOperationPending = false;
            render();
          }
        }
        return;
      }

      const resetStudentPin = httpsCallable(functions, "resetStudentPin");
      let successCount = 0;
      let failCount = 0;

      for (const cb of checkboxes) {
        const studentId = cb.value;
        const student = data.students.find(s => String(s.id) === studentId);
        if (student) {
          try {
            await resetStudentPin({
              classroomId: "morgan",
              studentId: String(student.id),
              newPin
            });
            student.credentialActive = true;
            successCount++;
          } catch (error) {
            console.error("Failed to activate student", student.name, error);
            failCount++;
          }
        }
      }

      saveData();
      message = `Bulk activation complete. ${successCount} succeeded, ${failCount} failed.`;
      render();
    }

    function importBackup(event) {
      if (!requireTeacher()) return;
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        if (!requireTeacher()) return;

        try {
          const imported = JSON.parse(e.target.result);
          if (!Array.isArray(imported.students) || !Array.isArray(imported.transactions)) {
            alert("That backup file does not look right.");
            return;
          }

          data = normalizeData({
            students: imported.students,
            transactions: imported.transactions,
            loginHistory: imported.loginHistory || data.loginHistory || [],
            settings: imported.settings || data.settings,
            lastBackupAt: imported.exportedAt || new Date().toISOString()
          });
        saveData();
        showMessage("Backup imported.");
        } catch {
          alert("Could not import that file.");
        }
      };
      reader.readAsText(file);
    }

          document.getElementById("app").innerHTML = `<div class="card hero"><h2>Resolving Tenant...</h2><p class="tagline">Connecting to classroom tenant...</p></div>`;
          return;

          document.getElementById("app").innerHTML = `

              </div>

      get studentAuthLogsError() { return studentAuthLogsError; },
      set studentAuthLogsError(val) { studentAuthLogsError = val; },
      get studentPinResetPending() { return studentPinResetPending; },
      set studentPinResetPending(val) { studentPinResetPending = val; },
      get bulkOperationPending() { return bulkOperationPending; },
      set bulkOperationPending(val) { bulkOperationPending = val; },
      get messageTimeout() { return messageTimeout; },
      set messageTimeout(val) { messageTimeout = val; },
      get resolvedClassroom() { return resolvedClassroom; },
      set resolvedClassroom(val) { resolvedClassroom = val; },
      get resolvedTeacher() { return resolvedTeacher; },
      set resolvedTeacher(val) { resolvedTeacher = val; },
      get transactionTarget() { return transactionTarget; },
      set transactionTarget(val) { transactionTarget = val; },
      get teacherTransactionFilter() { return teacherTransactionFilter; },
      set teacherTransactionFilter(val) { teacherTransactionFilter = val; }
    };

    function resetAllGlobalState() {
      resetGlobalApplicationState(windowAppGlobals, cloneDefault);
      // Render-affecting V2 view state that is not part of the shared legacy
      // global contract must be cleared by the same synchronous reset, or a
      // previous tenant's offline badge / profile login ID can survive a switch.
      v2IsOffline = false;
      profileLoginIdStatus = "Checking...";
    }

    async function submitV2Onboarding() {
      const classroomName = document.getElementById("v2ClassroomName")?.value || "";
      if (!classroomName.trim()) {
        message = "Please enter a valid classroom name.";
        render();
        return;
      }
      message = "Creating classroom...";
      render();
      const callAdapter = async (name, payload) => {
        const callable = httpsCallable(functions, name);
        return await callable(payload);
      };
      const res = await orchestrateTeacherOnboarding(v2TenantSession, callAdapter, { classroomName });
      if (res.success && v2TenantSession.getState() === SESSION_STATES.ACTIVE) {
        const loadNetworkFn = async () => {
          if (typeof window !== "undefined" && typeof window.V2_TENANT_DATA_ADAPTER === "function") {
            return await window.V2_TENANT_DATA_ADAPTER({ uid: auth.currentUser?.uid, classroomId: v2TenantSession.classroomId });
          }
          throw new Error("V2 tenant data adapter is required in V2 mode.");
        };
        await loadClassroomDataWithCacheFallback(v2TenantSession, {
          loadNetworkFn,
          storageAdapter: localStorage,
          projectId: v2TenantSession.projectId
        });
      }
      render();
    }

    // The emulator connection may re-initialize the Firebase app under a demo
    // project ID, so it MUST run before the active project ID is derived and
    // before TenantSession is constructed. Otherwise V2 cache keys and envelope
    // validation would be built from the production project ID while the data
    // came from the emulator.
    connectPhase2bEmulatorsIfConfigured();

    // Single source of truth for the V2 cache namespace: the project ID of the
    // Firebase app actually in use. Production/default resolves to
    // "morgan-bank"; the browser emulator harness resolves to its demo project.
    const V2_ACTIVE_PROJECT_ID = app.options.projectId;

    const v2TenantSession = new TenantSession({
      storageAdapter: localStorage,
      cacheModule: { purgeTenantCache, purgeLegacyCache, buildCacheKey },
      projectId: V2_ACTIVE_PROJECT_ID,
      onResetGlobals: resetAllGlobalState,
      onStateChange: () => render(),
      authAdapter: { signOut: () => signOut(auth) }
    });

    // Keep the default-off build inert: constructing MultiTabInvalidator would
    // open a real BroadcastChannel even before start() installs listeners.
    const v2MultiTabInvalidator = IS_MULTI_TEACHER_V2_ENABLED
      ? new MultiTabInvalidator(v2TenantSession, {
          storageAdapter: localStorage,
          windowAdapter: typeof window !== "undefined" ? window : null,
          onInvalidated: () => render(),
          // Ends THIS tab's Firebase Auth session after the cross-tab purge, so
          // a refresh cannot re-resolve the invalidated teacher. Separate from
          // authAdapter above because it must not trigger a rebroadcast.
          localAuthAdapter: { signOut: () => signOut(auth) }
        })
      : null;
    v2TenantSession.multiTabInvalidator = v2MultiTabInvalidator;

    if (IS_MULTI_TEACHER_V2_ENABLED) {
      v2MultiTabInvalidator.start();
      if (typeof window !== "undefined" && typeof window.addEventListener === "function") {
        window.addEventListener("pagehide", () => v2MultiTabInvalidator.destroy());
        window.addEventListener("beforeunload", () => v2MultiTabInvalidator.destroy());
      }
    }

    let authObservedGeneration = 0;

    onAuthStateChanged(auth, async user => {
      const currentAuthGeneration = ++authObservedGeneration;

      if (IS_MULTI_TEACHER_V2_ENABLED) {
        // Synchronously invalidate previous tenant and render blocking state BEFORE token lookup
        v2TenantSession.invalidate("auth-observer-change", {
          uid: user?.uid || null,
          state: user ? SESSION_STATES.AUTHENTICATING : SESSION_STATES.SIGNED_OUT
        });

        let tokenResult = null;
        if (user) {
          try {
            tokenResult = await user.getIdTokenResult();
          } catch {
            tokenResult = { claims: {} };
          }
        }
        if (currentAuthGeneration !== authObservedGeneration) return;

        const callAdapter = async (name, payload) => {
          const callable = httpsCallable(functions, name);
          return await callable(payload);
        };
        const loadNetworkFn = async () => {
          if (typeof window !== "undefined" && typeof window.V2_TENANT_DATA_ADAPTER === "function") {
            return await window.V2_TENANT_DATA_ADAPTER({ uid: user?.uid, classroomId: v2TenantSession.classroomId });
          }
          throw new Error("V2 tenant data adapter is required in V2 mode.");
        };

        const res = await handleAuthTransition(v2TenantSession, user, tokenResult, {
          callAdapter,
          loadNetworkFn,
          storageAdapter: localStorage,
          projectId: v2TenantSession.projectId
        });

        if (currentAuthGeneration !== authObservedGeneration) return;

        if (res.executed && res.data) {
          data = res.data;
          v2IsOffline = Boolean(res.isOffline);
        }
        render();
        return;
      }

      const isAuthenticatedTeacher = user?.uid === TEACHER_UID;
      isTeacher = false;
      loggedInStudentId = null;
      studentAuthLogs = [];
      studentAuthLogsError = "";
      studentAuthLogsLoading = false;

      if (isAuthenticatedTeacher) {
        const loadedData = await loadData();
        if (currentAuthGeneration !== authObservedGeneration) return;

        data = loadedData;
        isTeacher = true;
        screen = "teacher";
        message = "Teacher dashboard unlocked.";
        void ensureTeacherClassroomProfile(user.uid);
      } else if (user) {
        try {
          const tokenResult = await user.getIdTokenResult();
          if (currentAuthGeneration !== authObservedGeneration) return;

          const { role, classroomId, studentId } = tokenResult.claims;
          const isSecureStudent = role === "student"
            && classroomId === "morgan"
            && typeof studentId === "string";

          if (!isSecureStudent) {
            message = "This account cannot access Morgan Bank.";
            await signOut(auth);
            return;
          }

          const studentSnapshot = await getDoc(
            doc(db, "classrooms", classroomId, "students", studentId)
          );
          if (currentAuthGeneration !== authObservedGeneration) return;

          if (!studentSnapshot.exists()) {
            message = "Your student account is not available. Please see Mr. Morgan.";
            await signOut(auth);
            return;
          }

          data = dataForSecureStudent(studentId, studentSnapshot.data());
          loggedInStudentId = studentId;
          loginTab = "student";
          screen = "student";
          message = `${currentStudent().name} is logged in.`;
        } catch (error) {
          console.error("Secure student profile load failed:", error);
          message = "Could not load your student account. Please try again.";
          await signOut(auth);
          return;
        }
      } else {
        data = cloneDefault();
        screen = "login";
      }

      render();
    });
    window.loginTeacher = loginTeacher;
window.loginTeacherWithGoogle = loginTeacherWithGoogle;
window.linkGoogleAccount = linkGoogleAccount;
window.handleLoginEnter = handleLoginEnter;
window.loginStudent = loginStudent;
window.openStudentAuthLogs = openStudentAuthLogs;

  </script>
