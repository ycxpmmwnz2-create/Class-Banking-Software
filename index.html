
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin />
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin />
  <!-- VITE_FIREBASE_FUNCTIONS_PRECONNECT -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <title>Mr. Morgan's Class Cash</title>

  <style>
    :root {
      --bg: #cdebe7;
      --card: #dff3f0;
      --text: #12323a;
      --muted: #5f7780;
      --line: #a9d3cf;
      --teal: #5ec7c2;
      --teal-dark: #238f8c;
      --mint: #b8ebd0;
      --sky: #c7e9f9;
      --coral: #ffb4a2;
      --shadow: 0 16px 40px rgba(18, 50, 58, 0.10);
      --shadow-soft: 0 8px 22px rgba(18, 50, 58, 0.08);
      --radius-lg: 28px;
      --radius-md: 18px;
      --radius-sm: 12px;
    }

    * { box-sizing: border-box; }
    html {
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, rgba(94, 199, 194, 0.42), transparent 34%),
        radial-gradient(circle at top right, rgba(163, 218, 218, 0.80), transparent 32%),
        linear-gradient(180deg, #dff3f0 0%, var(--bg) 100%);
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI Variable", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: var(--text);
    }

    h1, h2, h3 { letter-spacing: -0.03em; }
    h1 { margin: 0; font-size: clamp(32px, 4vw, 54px); line-height: 1; }
    h2 { margin: 0 0 14px; font-size: 25px; }
    h3 { margin: 18px 0 10px; font-size: 17px; }

    #app {
      width: 100%;
      min-width: 0;
      max-width: 1400px;
      margin: 0 auto;
    }

    .staging-deployment-banner {
      position: sticky;
      top: 0;
      z-index: 10000;
      width: min(1400px, 100%);
      margin: 0 auto 16px;
      border: 3px solid #6f240f;
      border-radius: 12px;
      background: #ffcf70;
      color: #421305;
      padding: 12px 18px;
      text-align: center;
      font-size: clamp(16px, 2vw, 21px);
      font-weight: 950;
      letter-spacing: 0.04em;
      box-shadow: 0 8px 22px rgba(66, 19, 5, 0.24);
    }

    .staging-deployment-banner[hidden] { display: none; }

    .hero {
      background: linear-gradient(135deg, rgba(94, 199, 194, 0.96), rgba(199, 233, 249, 0.94));
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: var(--radius-lg);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 18px;
      position: relative;
      overflow: hidden;
      display: grid;
      grid-template-columns: 160px minmax(0, 1fr);
      gap: 22px;
      align-items: center;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 230px;
      height: 230px;
      right: -70px;
      top: -90px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.36);
    }

    .hero-content {
      position: relative;
      z-index: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 14px;
      align-items: flex-start;
    }

    .center-logo-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0;
      position: relative;
      z-index: 1;
    }

    .center-logo {
      width: 160px;
      max-width: 100%;
      height: auto;
      display: block;
      opacity: 0.96;
      border-radius: 16px;
    }




    .tagline {
      margin: 10px 0 0;
      font-size: 18px;
      font-weight: 800;
      color: rgba(18, 50, 58, 0.78);
    }

    .hero-badge {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: 100%;
      font-weight: 900;
      color: var(--teal-dark);
    }

    .hero-meta-item {
      min-width: 0;
      max-width: 100%;
      background: rgba(255, 255, 255, 0.62);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 12px;
      padding: 8px 11px;
      box-shadow: 0 5px 14px rgba(30, 80, 89, 0.1);
      font-size: 14px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .classroom-code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      letter-spacing: 0.06em;
      -webkit-user-select: all;
      user-select: all;
    }

    .credential-pin {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 18px;
      font-weight: 900;
      letter-spacing: 0.12em;
      -webkit-user-select: all;
      user-select: all;
    }

    /* Credentials are intentionally screen-only. A browser print must not put
       every student's current PIN on paper. */
    @media print {
      .credential-pin-column { display: none !important; }
    }

    .message {
      background: rgba(211, 238, 233, 0.98);
      border: 1px solid rgba(216, 231, 236, 0.9);
      padding: 14px 16px;
      border-radius: var(--radius-md);
      font-weight: 800;
      margin-bottom: 16px;
      box-shadow: var(--shadow-soft);
    }

    .button-bar, .stats {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .dashboard-disclosure {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: rgba(243, 251, 250, 0.72);
      overflow: hidden;
    }

    .dashboard-disclosure > summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      cursor: pointer;
      font-weight: 900;
      list-style: none;
    }

    .dashboard-disclosure > summary::-webkit-details-marker { display: none; }

    .dashboard-disclosure > summary::after {
      content: "Show";
      flex: 0 0 auto;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(35, 143, 140, 0.1);
      color: var(--teal-dark);
      font-size: 12px;
    }

    .dashboard-disclosure[open] > summary::after { content: "Hide"; }

    .dashboard-disclosure > summary:hover {
      background: rgba(94, 199, 194, 0.08);
    }

    .dashboard-disclosure-summary {
      min-width: 0;
    }

    .dashboard-disclosure-summary h2 {
      margin: 0;
    }

    .dashboard-disclosure-meta {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
    }

    .dashboard-disclosure-content {
      padding: 4px 14px 14px;
    }

    .student-picker-disclosure {
      width: 100%;
    }

    .student-picker-disclosure .student-check-list {
      max-height: 320px;
      overflow-y: auto;
      padding: 4px 2px;
    }

    .dashboard-transaction-disclosure.card {
      padding: 0;
    }

    .dashboard-transaction-disclosure > summary {
      padding: 20px;
    }

    .dashboard-transaction-disclosure .dashboard-disclosure-content {
      padding: 0 20px 20px;
    }

    button {
      padding: 11px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #dff3f0;
      cursor: pointer;
      font-weight: 800;
      color: var(--text);
      box-shadow: 0 3px 10px rgba(18, 50, 58, 0.05);
      transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: var(--shadow-soft);
      background: #d4eeea;
    }

    .primary {
      border: 0;
      background: var(--teal-dark);
      color: white;
      margin-top: 6px;
    }

    .danger {
      border: 0;
      background: #fee2e2;
      color: #991b1b;
      margin-left: 6px;
    }

    .approve {
      border: 0;
      background: #dcfce7;
      color: #166534;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(5, minmax(140px, 1fr));
      gap: 12px;
    }

    .stat-box {
      background: var(--card);
      border: 1px solid rgba(216, 231, 236, 0.9);
      border-radius: var(--radius-md);
      padding: 16px;
      box-shadow: var(--shadow-soft);
      font-weight: 950;
      font-size: 20px;
    }

    .dashboard-snapshot {
      padding: 14px 18px;
      margin-bottom: 12px;
      background: rgba(239, 250, 248, 0.82);
    }

    .dashboard-section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .dashboard-section-heading h2 {
      margin: 0;
      font-size: 20px;
    }

    .dashboard-section-heading span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .dashboard-snapshot-metrics {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
    }

    .dashboard-snapshot-metric {
      min-width: 0;
      padding: 4px 16px;
    }

    .dashboard-snapshot-metric:first-child { padding-left: 0; }

    .dashboard-snapshot-metric + .dashboard-snapshot-metric {
      border-left: 1px solid rgba(36, 148, 144, 0.18);
    }

    .dashboard-snapshot-metric strong,
    .dashboard-snapshot-metric span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dashboard-snapshot-metric strong {
      font-size: 21px;
      letter-spacing: -0.03em;
    }

    .dashboard-snapshot-metric span {
      margin-top: 3px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }

    .dashboard-snapshot-details {
      margin-top: 10px;
      border: 0;
      border-top: 1px solid rgba(36, 148, 144, 0.14);
      border-radius: 0;
      overflow: visible;
      background: transparent;
    }

    .dashboard-snapshot-details > summary {
      padding: 9px 0 0;
      color: var(--teal-dark);
      font-size: 12px;
    }

    .dashboard-snapshot-details > summary::after {
      padding: 3px 8px;
      font-size: 11px;
    }

    .dashboard-snapshot-detail-list {
      display: flex;
      gap: 8px 18px;
      flex-wrap: wrap;
      padding-top: 10px;
      color: #29464e;
      font-size: 13px;
      font-weight: 800;
    }

    .insights-dashboard-copy { min-width: 0; }

    .insights-dashboard-copy h2 {
      margin: 3px 0 6px;
      font-size: 20px;
    }

    .insights-dashboard-copy p {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.42;
    }

    .insights-eyebrow {
      display: block;
      color: var(--teal-dark);
      font-size: 12px;
      font-weight: 950;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .insights-shell {
      width: min(980px, 100%);
      margin: 0 auto;
      display: grid;
      gap: 16px;
    }

    .insights-intro {
      padding: clamp(22px, 4vw, 38px);
      background: linear-gradient(145deg, rgba(239, 250, 248, 0.98), rgba(214, 239, 236, 0.98));
    }

    .insights-intro h2 {
      margin: 8px 0 10px;
      font-size: clamp(29px, 5vw, 44px);
    }

    .insights-intro > p {
      max-width: 680px;
      margin: 0;
      color: var(--muted);
      font-size: 17px;
      font-weight: 720;
      line-height: 1.55;
    }

    .insights-controls {
      margin-top: 26px;
    }

    .insights-periods {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      max-width: 360px;
      padding: 6px;
      border: 1px solid rgba(169, 211, 207, 0.86);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.48);
    }

    .insights-periods button {
      border: 0;
      border-radius: 12px;
      background: transparent;
      box-shadow: none;
      padding: 9px 12px;
    }

    .insights-periods button.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 4px 12px rgba(18, 50, 58, 0.09);
    }

    .insights-report-meta {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.4;
    }

    .insights-question-card textarea {
      min-height: 96px;
      background: rgba(255, 255, 255, 0.72);
    }

    .insights-question-actions {
      display: flex;
      justify-content: flex-end;
    }

    .insights-question-actions button {
      margin: 0;
    }

    .insights-quick-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 12px 0 16px;
    }

    .insights-quick-questions button {
      margin: 0;
      border: 1px solid rgba(36, 148, 144, 0.32);
      background: rgba(255, 255, 255, 0.7);
      color: var(--teal-dark);
      box-shadow: none;
    }

    .insights-question-asked {
      margin-top: 6px;
      color: var(--muted);
      font-weight: 760;
      line-height: 1.45;
    }

    .insights-answer-copy {
      margin: 14px 0 0;
      color: #29464e;
      font-weight: 720;
      font-size: 17px;
      line-height: 1.6;
      white-space: pre-line;
    }

    .insights-answer-details {
      margin-top: 14px;
      border-top: 1px solid rgba(169, 211, 207, 0.72);
      padding-top: 10px;
    }

    .insights-answer-details summary {
      color: var(--teal-dark);
      cursor: pointer;
      font-weight: 850;
    }

    .insights-question-evidence {
      display: grid;
      gap: 5px;
      margin-top: 9px;
    }

    .insight-evidence {
      margin-top: 9px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.4;
    }

    .teacher-dashboard-top-row {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      overflow: hidden;
      border: 1px solid rgba(36, 148, 144, 0.2);
      border-radius: var(--radius-lg);
      margin-bottom: 12px;
      background: rgba(239, 250, 248, 0.9);
      box-shadow: var(--shadow-soft);
    }

    .teacher-dashboard-top-row--without-login {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .teacher-dashboard-essential {
      display: flex;
      min-width: 0;
      min-height: 174px;
      flex-direction: column;
      padding: 16px;
    }

    .teacher-dashboard-essential + .teacher-dashboard-essential {
      border-left: 1px solid rgba(36, 148, 144, 0.18);
    }

    .teacher-dashboard-essential h2 {
      margin: 3px 0 6px;
      font-size: 20px;
    }

    .teacher-dashboard-essential p {
      margin: 0 0 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
      line-height: 1.42;
    }

    .dashboard-essential-action {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .dashboard-essential-action .primary { margin-top: 0; }

    .student-login-info {
      background: rgba(247, 253, 252, 0.82);
    }

    .student-login-info-code {
      display: inline-block;
      padding: 8px 10px;
      border: 1px solid rgba(36, 148, 144, 0.35);
      border-radius: var(--radius-sm);
      background: white;
      color: var(--teal-dark);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 17px;
      font-weight: 950;
      letter-spacing: 0.08em;
      -webkit-user-select: all;
      user-select: all;
    }

    .teacher-rent-card {
      background: rgba(228, 246, 243, 0.72);
    }

    .teacher-rent-card .big-balance {
      margin: 0 0 5px;
      font-size: 32px;
    }

    .dashboard-rent-disclosure {
      border: 0;
      margin-top: auto;
      overflow: visible;
      background: transparent;
    }

    .dashboard-rent-disclosure > summary {
      width: fit-content;
      border: 1px solid rgba(36, 148, 144, 0.3);
      border-radius: 999px;
      padding: 8px 12px;
      background: #edf9f8;
      color: var(--teal-dark);
      font-size: 12px;
    }

    .dashboard-rent-disclosure > summary::after { display: none; }

    .dashboard-rent-editor {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px;
      align-items: end;
      padding-top: 10px;
    }

    .dashboard-rent-editor label { grid-column: 1 / -1; }

    .dashboard-rent-editor input,
    .dashboard-rent-editor button { margin: 0; }

    .insights-dashboard-card {
      background: linear-gradient(135deg, rgba(239, 250, 248, 0.96), rgba(217, 241, 238, 0.96));
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(330px, 1fr));
      gap: 16px;
    }

    .wide-grid {
      display: grid;
      grid-template-columns: minmax(340px, 0.9fr) minmax(440px, 1.4fr);
      gap: 16px;
      margin-bottom: 16px;
    }

    .grid > *,
    .wide-grid > * {
      min-width: 0;
    }

    .card {
      width: 100%;
      min-width: 0;
      max-width: 100%;
      background: #dff3f0;
      padding: 20px;
      border-radius: var(--radius-lg);
      border: 1px solid rgba(216, 231, 236, 0.9);
      box-shadow: var(--shadow-soft);
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      backdrop-filter: blur(10px);
    }

    .soft-card {
      background: linear-gradient(135deg, #eaf8f6, #d3eee9);
    }

    input, select, textarea {
      display: block;
      width: 100%;
      padding: 12px;
      margin-bottom: 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--line);
      font-size: 16px;
      font-family: inherit;
      background: #dff3f0;
      color: var(--text);
    }

    input:focus, select:focus, textarea:focus {
      outline: 3px solid rgba(94, 199, 194, .25);
      border-color: var(--teal);
    }

    textarea { min-height: 130px; resize: vertical; }

    label {
      display: block;
      font-weight: 900;
      margin-bottom: 6px;
      color: #29464e;
    }


    .settings-list {
      display: grid;
      gap: 8px;
      margin: 10px 0 18px;
    }

    .setting-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(200, 223, 223, 0.62);
      font-weight: 900;
      color: #29464e;
    }

    .setting-row:last-child {
      border-bottom: 0;
    }

    .setting-text {
      line-height: 1.25;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 52px;
      height: 30px;
      flex: 0 0 auto;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
      margin: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #cbd5d6;
      transition: .18s;
      border-radius: 999px;
      box-shadow: inset 0 0 0 1px rgba(18, 50, 58, 0.06);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 24px;
      width: 24px;
      left: 3px;
      bottom: 3px;
      background: #ffffff;
      transition: .18s;
      border-radius: 50%;
      box-shadow: 0 2px 8px rgba(18, 50, 58, 0.20);
    }

    .switch input:checked + .slider {
      background: var(--teal-dark);
    }

    .switch input:checked + .slider:before {
      transform: translateX(22px);
    }


    .segmented-control {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background: rgba(243, 251, 250, 0.72);
      border: 1px solid var(--line);
      padding: 8px;
      border-radius: 18px;
      margin-bottom: 14px;
    }

    .segment-button {
      border: 0;
      box-shadow: none;
      background: transparent;
      color: var(--text);
      border-radius: 14px;
    }

    .segment-button.active {
      background: var(--teal-dark);
      color: white;
    }

    .teacher-choice-memo {
      display: none;
    }

    .teacher-choice-memo.visible {
      display: block;
    }

    .login-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background-color: rgba(244, 248, 251, 0.82);
      padding: 8px;
      border-radius: 18px;
      margin-bottom: 16px;
    }

    .active-tab {
      border: 0;
      background: var(--teal-dark);
      color: white;
      font-weight: 900;
    }

    .inactive-tab {
      background-color: #dff3f0;
      font-weight: 900;
    }

    .quick-cash-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 10px 0;
    }

    .quick-btn {
      border: 0;
      border-radius: 18px;
      font-size: 22px;
      padding: 18px 8px;
      color: var(--text);
      background: var(--mint);
    }

    .quick-btn.subtract {
      background: var(--coral);
      color: var(--text);
    }

    .dashboard-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.45fr) minmax(280px, 0.75fr);
      gap: 16px;
      align-items: start;
      margin-bottom: 12px;
    }

    .dashboard-workspace > * { min-width: 0; }

    .dashboard-money-panel,
    .dashboard-activity-panel { margin-bottom: 0; }

    .dashboard-work-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 14px;
    }

    .dashboard-work-header h2,
    .dashboard-activity-panel h2 {
      margin: 3px 0 0;
      font-size: 21px;

import { app, auth, db, functions, connectPhase2bEmulatorsIfConfigured, firebaseDeploymentTier, providerAppCheckReadyPromise } from "./src/firebase/firebase.js";

import { PROVIDER_INSIGHTS_PERIODS, VERSION3_GEMINI_BROWSER_PROJECT_ID, createProviderInsightsBrowserClient, mapProviderInsightsError, resolveLiveProviderInsightsBrowserActivation, resolveProviderInsightsBrowserActivation } from "./src/insights/providerInsightsClient.js";

const IS_MULTI_TEACHER_V2_ENABLED = import.meta.env.VITE_MULTI_TEACHER_V2_ENABLED === "true";
    const VERSION3_GEMINI_BROWSER_BUILD_ENABLED =

    const defaultSettings = {

      studentSubtractRequestsEnabled: true,

    const defaultData = {
      students: [],

    let data = cloneDefault();
    let screen = "login";

    const PROVIDER_QUICK_QUESTIONS = Object.freeze([

    let providerQuestionDraft = "";
    let providerQuestionSubmitted = "";

    let providerQuestionLoading = false;
    let providerQuestionError = "";
    let providerQuestionRetryRequest = null;
    let providerQuestionDataSignature = null;
    let providerQuestionCapturedIdentity = null;
    let providerQuestionRequestVersion = 0;

    let studentLoginIdDraft = "";
    // The validated signed-out login locator for this browser, or null. It holds
    // only the two non-secret fields a returning student would otherwise retype:
    // the classroom code and the canonical login ID the server already issued.
    // Never a PIN, custom token, ID token, Auth UID, student name, student
    // document, credential document, balance, transaction, or tenant data.
    let studentLoginLocator = null;
    let studentLoginPending = false;
    let studentAuthLogs = [];
    let studentAuthLogsLoading = false;
    let studentAuthLogsError = "";
    let studentPinResetPending = false;
    // The only plaintext PIN retained after a reset is the exact value the
    // teacher just submitted, and only while that same student profile remains
    // open. It is never added to application data, storage, exports, logs, or a
    // callable response.
    let temporaryProfileStudentPin = null;
    let bulkOperationPending = false;
    let studentLifecyclePending = false;
    let studentMoneySubmissionPending = false;
    let rentUpdatePending = false;

    let studentMoneyRetryPayload = null;

    const v2ActivatedStudentIds = new Set();

    // cache, a backup export, localStorage, or a saved write payload, all of

    let v2StudentPins = new Map();

    let v2StudentPinsError = "";

    // supersedes them. Successful resets instead remain same-tenant in-memory

    let v2StudentPinsRequestVersion = 0;
    let v2StudentPinsResetVersion = 0;
    let v2StudentPinOverrides = new Map();

    // reset is not sufficient on its own: setScreen renders BEFORE the fetch

    // teacher's PINs for one frame. Student IDs restart at 1 in every classroom,

    let v2StudentPinsIdentity = null;
    let resolvedClassroom = null;
    let resolvedTeacher = null;
    let v2IsOffline = false;

    function requireTeacher() {
      if (IS_MULTI_TEACHER_V2_ENABLED) {
        return v2TenantSession.requireTeacher(auth.currentUser?.uid);
      }

    // Phase 1B: additive wiring for the new teachers/classrooms foundation.

    // check and the provisioning itself both happen server-side inside the
    // idempotent ensureTeacherClassroom callable. Nothing here affects
    // morganBank/classroomData, `data`, `screen`, or `message`.
    async function ensureTeacherClassroomProfile(uid) {
      if (uid !== TEACHER_UID) return;
      try {
        const ensureTeacherClassroom = httpsCallable(functions, "ensureTeacherClassroom");
        await ensureTeacherClassroom();
      } catch (error) {
        console.error("Teacher/classroom provisioning check failed:", error);

    }

    function cloneDefault() {
      return JSON.parse(JSON.stringify(defaultData));
    }

    function normalizeData(parsed) {
      return {
        students: Array.isArray(parsed.students)
          ? parsed.students.map(student => ({ ...student, frozen: Boolean(student.frozen) }))

        transactions: Array.isArray(parsed.transactions) ? parsed.transactions : [],

        settings: {
          ...defaultSettings,
          ...(parsed.settings || {}),
          rentAmount: Number.isSafeInteger(parsed.settings?.rentAmount)
            && parsed.settings.rentAmount >= 0
            && parsed.settings.rentAmount <= MAX_RENT_AMOUNT

          reasons: Array.isArray(parsed.settings?.reasons) ? parsed.settings.reasons : defaultSettings.reasons,

    async function saveData() {
      if (IS_MULTI_TEACHER_V2_ENABLED) {
        if (typeof v2SaveTenantData !== "function") {
          console.error("The V2 tenant data service is required in V2 mode.");
          return { executed: false, reason: "missing-v2-save-adapter" };
        }
        // Snapshot the exact attempted state. Callers historically do not await
        // saveData(), so a later UI mutation must not be mistaken for the state
        // this particular server commit accepted.
        const attemptedData = JSON.parse(JSON.stringify(data));
        const result = await orchestrateClassroomDataSave(v2TenantSession, v2SaveTenantData, attemptedData, { storageAdapter: localStorage, projectId: v2TenantSession.projectId });
        if (result.executed) {
          // Only a server-accepted write may advance the diff baseline. A
          // failed save must leave it alone, or the next save would skip the
          // documents this one never persisted.
          v2LastPersistedData = attemptedData;
        } else if (result.reason === "concurrent-classroom-change") {
          await reloadV2ClassroomAfterSaveConflict();
        } else if (!result.reason?.startsWith("stale-epoch-ignored")) {
          message = result.error || "The classroom change could not be saved.";
          render();
        }
        return result;
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));

      try {
        await setDoc(doc(db, "morganBank", "classroomData"), data);
      } catch (error) {
        console.error("Firestore save failed:", error);

    /**
     * Loads the teacher's own classroom PINs for the Credentials screen.
     *
     * Teacher-gated and epoch-guarded like every other V2 read. A failure leaves
     * unknown values showing "Unavailable" rather than a stale or foreign PIN.
     * A same-tenant value may remain visible during refresh, but an unstamped or
     * invalidated map is cleared before the call.
     */
    async function loadStudentPinDirectory() {
      if (!IS_MULTI_TEACHER_V2_ENABLED || !requireTeacher()) return;
      if (v2StudentPinsLoading) return;

      const captured = v2TenantSession.captureIdentity();
      const requestResetVersion = v2StudentPinsResetVersion;
      v2StudentPinsLoading = true;
      v2StudentPinsError = "";
      if (!v2StudentPinsIdentity ||
          !v2TenantSession.validateCapturedIdentity(v2StudentPinsIdentity)) {
        v2StudentPins = new Map();
        v2StudentPinsIdentity = null;
      }
      const requestVersion = ++v2StudentPinsRequestVersion;
      render();

      const fetchFn = async () => {
        const callable = httpsCallable(functions, "listStudentPinsV2");
        return await callable({});
      };
      const res = await orchestrateStudentPinDirectoryFetch(v2TenantSession, fetchFn);
      if (!v2TenantSession.validateCapturedIdentity(captured)) return;
      if (requestVersion !== v2StudentPinsRequestVersion) return;

      if (res.executed) {
        const reconciled = reconcileStudentPinDirectory({
          directoryPins: res.pins,
          pendingResets: v2StudentPinOverrides,
          requestResetVersion,
          requestIdentity: captured,
          currentIdentity: v2TenantSession.captureIdentity()
        });
        if (!reconciled) {
          v2StudentPins = new Map();
          v2StudentPinOverrides = new Map();
          v2StudentPinsIdentity = null;
          v2StudentPinsError = "Could not load student PINs.";
          v2StudentPinsLoading = false;
          render();
          return;
        }
        v2StudentPins = reconciled.pins;
        v2StudentPinOverrides = reconciled.pendingResets;
        v2StudentPinsIdentity = captured;
      } else if (res.reason !== "stale-epoch-ignored") {
        if (!v2StudentPinsIdentity ||
            !v2TenantSession.validateCapturedIdentity(v2StudentPinsIdentity)) {
          v2StudentPins = new Map();
          v2StudentPinsIdentity = null;
        }
        v2StudentPinsError = res.error || "Could not load student PINs.";
      }
      v2StudentPinsLoading = false;
      render();
    }

    // Credentials renders one cell per student from this. Absent means the student
    // predates the PIN directory and needs one reset before their PIN is stored.
    // The identity check is the load-bearing part: a PIN may be rendered only
    // while the session is still the exact tenant it was fetched for.
    function credentialStudentPin(studentId) {
      if (!v2StudentPinsIdentity) return "";
      if (!v2TenantSession.validateCapturedIdentity(v2StudentPinsIdentity)) return "";
      return v2StudentPins.get(String(studentId)) || "";
    }

    // A successful reset is newer than any PIN-directory request that was
    // already in flight. Record the submitted value only in tenant-stamped
    // memory. The reset revision lets the older response restore other students
    // while this exact value wins reconciliation.
    function rememberResetStudentPin(captured, studentId, pin) {
      if (!v2TenantSession.validateCapturedIdentity(captured)) return;
      const resetVersion = ++v2StudentPinsResetVersion;
      const studentKey = String(studentId);
      const nextOverrides = new Map(v2StudentPinOverrides);
      nextOverrides.set(studentKey, {
        pin,
        version: resetVersion,
        identity: { ...captured }
      });
      const nextPins = v2StudentPinsIdentity &&
        v2TenantSession.validateCapturedIdentity(v2StudentPinsIdentity)
        ? new Map(v2StudentPins)
        : new Map();
      nextPins.set(studentKey, pin);
      v2StudentPinOverrides = nextOverrides;
      v2StudentPins = nextPins;
      v2StudentPinsIdentity = captured;
      v2StudentPinsError = "";
    }

    async function askProviderQuestion(retry = false) {
      if (!providerInsightsEnabled || !providerInsightsClient || !requireTeacher()) return;
      if (providerQuestionLoading) return;
      const periodDays = insightsPeriodDays;
      const dataSignature = currentInsightsDataSignature();
      const capturedIdentity = v2TenantSession.captureIdentity();

      let request;
      if (retry) {
        const retryState = providerQuestionRetryRequest;
        if (
          !retryState
          || retryState.periodDays !== periodDays
          || retryState.dataSignature !== dataSignature
          || !v2TenantSession.validateCapturedIdentity(retryState.capturedIdentity)
        ) {
          resetProviderInsightsState();
          render();
          return;
        }
        request = retryState.request;
      } else {
        const questionElement = document.getElementById("providerQuestionInput");
        const question = String(questionElement?.value ?? providerQuestionDraft).trim();
        if (question.length < 3 || question.length > 500) {
          providerQuestionError = "Type a question between 3 and 500 characters.";
          render();
          return;
        }
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone || "UTC";
        request = {
          requestId: providerInsightsClient.newRequestId(),
          kind: "question",
          periodDays,
          timeZone,
          question,
        };
      }

      providerQuestionRequestVersion += 1;
      const requestVersion = providerQuestionRequestVersion;
      providerQuestionSubmitted = request.question;
      providerQuestionDraft = request.question;
      providerQuestionResult = null;
      providerQuestionLoading = true;
      providerQuestionError = "";
      providerQuestionRetryRequest = null;
      providerQuestionDataSignature = dataSignature;
      providerQuestionCapturedIdentity = capturedIdentity;
      screen = "insights";
      render();

      try {
        const result = await providerInsightsClient.ask(request);
        if (!providerQuestionContextIsCurrent({
          capturedIdentity,
          dataSignature,
          periodDays,
          requestVersion,
        })) return;
        providerQuestionResult = result;
        if (providerQuestionDraft === request.question) providerQuestionDraft = "";
      } catch (error) {
        if (!providerQuestionContextIsCurrent({
          capturedIdentity,
          dataSignature,
          periodDays,
          requestVersion,
        })) return;
        const safeError = mapProviderInsightsError(error, {
          testMode: providerInsightsEnvironment === "emulator",
        });
        providerQuestionError = safeError.message;
        if (safeError.ambiguous) {
          providerQuestionRetryRequest = {
            request,
            periodDays,
            dataSignature,
            capturedIdentity,
          };
        }
      } finally {
        if (providerQuestionRequestVersion === requestVersion) {
          providerQuestionLoading = false;
          render();
        }
      }
    }

      if (IS_MULTI_TEACHER_V2_ENABLED) {
        const captured = v2TenantSession.captureIdentity();
        const resetFn = async (p) => {
          const resetStudentPin = httpsCallable(functions, "resetStudentPinV2");
          return await resetStudentPin(p);
        };
        const payload = {
          studentId: String(student.id),
          newPin
        };
        const res = await orchestrateStudentPinReset(v2TenantSession, resetFn, payload);
        if (!v2TenantSession.validateCapturedIdentity(captured)) return;

        if (res.executed) {
          // View-only. The PIN reset is already durable server-side; the
          // student document itself carries no activation state, so there is
          // nothing to persist here.
          v2ActivatedStudentIds.add(String(student.id));
          rememberResetStudentPin(captured, student.id, newPin);
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = `PIN reset successfully for ${student.name}.`;
            if (screen === "studentProfile" && teacherProfileStudentId === student.id) {
              temporaryProfileStudentPin = { studentId: student.id, pin: newPin };
            }
            studentPinResetPending = false;
            render();
          }
        } else {
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = res.error || "Could not reset the student PIN.";
            studentPinResetPending = false;
            render();
          }
        }
        return;
      }

      try {
        const resetStudentPin = httpsCallable(functions, "resetStudentPin");
        await resetStudentPin({
          classroomId: "morgan",
          studentId: String(student.id),
          newPin
        });
        student.credentialActive = true;
        saveData();
        message = `PIN reset successfully for ${student.name}.`;
        if (screen === "studentProfile" && teacherProfileStudentId === student.id) {
          temporaryProfileStudentPin = { studentId: student.id, pin: newPin };
        }
      } catch (error) {
        console.error("Student PIN reset failed:", error);
        message = error.code === "functions/not-found"
          ? `No secure login credential was found for ${student.name}.`
          : "Could not reset the student PIN. Please try again.";
      } finally {
        studentPinResetPending = false;
        render();
      }
    }

    async function loginStudent() {
      if (studentLoginPending) return;

      // A returning student in PIN-only mode has no classroom-code or login-ID
      // input to read, so the already validated locator supplies both non-secret
      // fields. The submitted payload stays identical to the full form's.
      const rememberedLocator = IS_MULTI_TEACHER_V2_ENABLED ? studentLoginLocator : null;
      const classroomCode = rememberedLocator
        ? rememberedLocator.classroomCode
        : IS_MULTI_TEACHER_V2_ENABLED
          ? formatStudentClassroomCodeDraft(
              document.getElementById("studentClassroomCode")?.value || ""
            )
          : "";
      const loginId = rememberedLocator
        ? rememberedLocator.loginId
        : document.getElementById("studentLoginId")?.value.trim() || "";
      const pin = document.getElementById("studentPin")?.value || "";
      studentClassroomCodeDraft = classroomCode;
      studentLoginIdDraft = loginId;

      if (IS_MULTI_TEACHER_V2_ENABLED && !classroomCode) {
        message = "Enter your classroom code.";
        render();
        return;
      }

      if (!loginId) {
        message = "Enter your student login ID.";
        render();
        return;
      }

      if (!pin) {
        message = "Enter your PIN.";
        render();
        return;
      }

      studentLoginPending = true;
      message = "Signing in...";
      render();

      try {
        if (IS_MULTI_TEACHER_V2_ENABLED) {
          const callableAdapter = async (name, payload) => {
            const callable = httpsCallable(functions, name);
            return await callable(payload);
          };
          const signInAdapter = async (token) => {
            await setPersistence(auth, browserSessionPersistence);
            return signInWithCustomToken(auth, token);
          };
          const result = await orchestrateStudentLogin(
            v2TenantSession,
            callableAdapter,
            signInAdapter,
            { classroomCode, loginId, pin }
          );
          if (!result.executed) {
            if (result.reason === "stale-epoch-ignored") return;
            message = result.rawCode === "unauthenticated"
              ? "Wrong classroom code, student login ID, or PIN."
              : "Student login is unavailable. Please try again.";
            return;
          }
          rememberStudentLoginLocator(classroomCode, loginId);
          // Re-read rather than trusting the write: if storage was unavailable the
          // locator stays null and the next visit simply asks for the full form
          // again. A successful login is never made conditional on storage.
          studentLoginLocator = readStudentLoginLocator();
          studentClassroomCodeDraft = studentLoginLocator
            ? studentLoginLocator.classroomCode
            : readRememberedStudentClassroomCode();
          if (studentLoginLocator) {
            clearStudentClassroomCodeFromLink(classroomCode);
          }
          studentLoginIdDraft = "";
          return;
        }

        const studentPinLogin = httpsCallable(functions, "studentPinLogin");
        const response = await studentPinLogin({ loginId, pin });

        if (typeof response.data?.token !== "string") {
          throw new Error("The login service did not return a token.");
        }

        await setPersistence(auth, browserSessionPersistence);
        await signInWithCustomToken(auth, response.data.token);
        studentLoginIdDraft = "";
      } catch (error) {
        if (!IS_MULTI_TEACHER_V2_ENABLED) {
          console.error("Student sign-in failed:", error);
        }
        message = error.code === "functions/unauthenticated"
          ? "Wrong student login ID or PIN."
          : "Student login is unavailable. Please try again.";
      } finally {
        studentLoginPending = false;
        if (screen === "login") {
          render();
        }
      }
    }

    async function logout() {
      clearTemporaryProfileStudentPin();
      if (IS_MULTI_TEACHER_V2_ENABLED) {
        const logoutQuarantineInstalled = v2MultiTabInvalidator.quarantineUid(
          auth.currentUser?.uid || v2TenantSession.uid
        );
        const result = await orchestrateProductionLogout(
          v2TenantSession,
          {
            signOut: () => terminateDurableAuthSession({
              setMemoryPersistence: () => setPersistence(auth, inMemoryPersistence),
              signOut: () => signOut(auth)
            })
          },
          render
        );
        if (result.warning) {
          message = logoutQuarantineInstalled
            ? "Morgan Bank cleared this page, but Firebase could not confirm a complete sign-out. Close every Morgan Bank tab, reopen the site, and choose Log Out again if your account returns."
            : "Morgan Bank cleared this page, but the browser could not preserve its logout guard and Firebase could not confirm sign-out. Close every Morgan Bank tab and browser window before reopening the site. If your account returns, choose Log Out again.";
          render();
        }
        return;
      }

      if (auth.currentUser) {
        try {
          await signOut(auth);
        } catch (error) {
          console.error("Sign-out failed:", error);
          showMessage("Could not sign out. Please try again.");
          return;
        }
      }

      isTeacher = false;
      loggedInStudentId = null;
      screen = "login";
      loginTab = "teacher";
      message = "Logged out.";
      render();
    }

    function submitStudentRequest() {
      const student = currentStudent();
      if (!student) return;

      if (student.frozen) {
        showMessage("This account is frozen. Please see Mr. Morgan.");
        return;
      }

      if (!data.settings.studentRequestsEnabled) {
        showMessage("Student requests are currently turned off.");
        return;
      }

      const type = document.getElementById("studentRequestType").value;
      const amount = Number(document.getElementById("studentRequestAmount").value);
      const reason = document.getElementById("studentRequestReason").value;

      if (type === "Add" && !data.settings.studentAddRequestsEnabled) {
        showMessage("Add-money requests are currently turned off.");
        return;
      }

      if (type === "Subtract" && !data.settings.studentSubtractRequestsEnabled) {
        showMessage("Spend-money requests are currently turned off.");
        return;
      }

      if (!amount || amount <= 0) {
        showMessage("Enter an amount greater than 0.");
        return;
      }

      if (type === "Subtract" && amount > Number(student.balance)) {
        showMessage("That payment is more than your approved balance.");
        return;
      }

      const shouldBePending = type === "Add";

      const newTransaction = {
        id: Date.now(),
        date: new Date().toLocaleString(),
        studentId: student.id,
        studentName: student.name,
        type,
        amount,
        reason,
        memo: "",
        category: "",
        status: shouldBePending ? "Pending" : "Approved",
        source: "Student"
      };

      if (!shouldBePending) {
        changeStudentBalance(student.id, type, amount);
      }

      data.transactions = [newTransaction].concat(data.transactions);
      saveData();
      message = shouldBePending
        ? "Credit request submitted for teacher approval."
        : "Payment submitted and approved.";
      render();
    }

    function approveAllCreditRequests() {
      if (!requireTeacher()) return;
      const pendingCredits = data.transactions.filter(transaction =>
        transaction.status === "Pending" && transaction.type === "Add"
      );

      if (pendingCredits.length === 0) {
        showMessage("No pending credit requests to approve.");
        return;
      }

      const confirmed = confirm("Approve all pending credit requests?");
      if (!confirmed) return;

      pendingCredits.forEach(transaction => {
        changeStudentBalance(transaction.studentId, "Add", Number(transaction.amount));
      });

      const pendingCreditIds = new Set(pendingCredits.map(transaction => transaction.id));

      data.transactions = data.transactions.map(transaction => {
        if (pendingCreditIds.has(transaction.id)) {
          return { ...transaction, status: "Approved" };
        }
        return transaction;
      });

      saveData();
      message = pendingCredits.length + " credit request(s) approved.";
      render();
    }

    function approveTransaction(transactionId) {
      if (!requireTeacher()) return;
      const transaction = data.transactions.find(item => item.id === transactionId);
      if (!transaction || transaction.status !== "Pending") return;

      const student = data.students.find(item => item.id === transaction.studentId);
      if (!student) {
        showMessage("Student no longer exists on the roster.");
        return;
      }

      if (transaction.type === "Subtract" && Number(transaction.amount) > Number(student.balance)) {
        const confirmed = confirm("This approval would make " + student.name + "'s balance negative. Approve anyway?");
        if (!confirmed) return;
      }

      changeStudentBalance(transaction.studentId, transaction.type, transaction.amount);

      data.transactions = data.transactions.map(item => {
        if (item.id === transactionId) return { ...item, status: "Approved" };
        return item;
      });

      saveData();
      message = "Transaction approved.";
      render();
    }

    function denyTransaction(transactionId) {
      if (!requireTeacher()) return;
      data.transactions = data.transactions.map(item => {
        if (item.id === transactionId) return { ...item, status: "Denied" };
        return item;
      });

      saveData();
      message = "Transaction denied.";
      render();
    }

    async function addStudent() {
      if (!requireTeacher() || studentLifecyclePending) return;
      const name = document.getElementById("newStudentName").value.trim();
      const pin = document.getElementById("newStudentPin").value.trim();
      const balanceInput = document.getElementById("newStudentBalance").value;
      const startingBalance = balanceInput === "" ? 0 : Number(balanceInput);

      if (!name) {
        showMessage("Enter a student name.");
        return;
      }

      if (!pin) {
        showMessage("Enter a PIN/password for the student.");
        return;
      }

      if (IS_MULTI_TEACHER_V2_ENABLED && !/^[0-9]{4}$/.test(pin)) {
        showMessage("PIN must be exactly 4 digits.");
        return;
      }

      if (data.students.some(student => student.name.toLowerCase() === name.toLowerCase())) {
        showMessage("That student name is already on the roster.");
        return;
      }

      if (IS_MULTI_TEACHER_V2_ENABLED) {
        if (!Number.isFinite(startingBalance)) {
          showMessage("Enter a valid starting balance.");
          return;
        }
        studentLifecyclePending = true;
        message = `Adding ${name}...`;
        render();
        const captured = v2TenantSession.captureIdentity();
        const callableAdapter = async (functionName, payload) => {
          const callable = httpsCallable(functions, functionName);
          return await callable(payload);
        };
        const result = await orchestrateCreateStudent(v2TenantSession, callableAdapter, {
          name,
          startingBalance,
          pin
        });
        if (!v2TenantSession.validateCapturedIdentity(captured)) return;
        if (result.executed) {
          // The callable intentionally returns only the four public fields.
          // The aggregate/persisted student contract adds the required
          // transaction mirror, which starts empty for a newly-created student.
          data.students.push({ ...result.result.student, transactions: [] });
          // The server just committed that exact body, so it belongs in the
          // save baseline too — as its own object, never a shared reference.
          // Without it the next save has no baseline entry for this student and
          // compares the stored document against the body it is about to write,
          // so adding a student and then giving them money before the next save
          // aborts as a "concurrent" change that never happened.
          if (v2LastPersistedData && Array.isArray(v2LastPersistedData.students)) {
            v2LastPersistedData.students.push({ ...result.result.student, transactions: [] });
          }
          v2ActivatedStudentIds.add(String(result.result.student.id));
          message = `${result.result.student.name} added. Login ID: ${result.result.loginId}.`;
        } else {
          message = result.error || "The student could not be added.";
        }
        studentLifecyclePending = false;
        render();
        return;
      }

      const maxId = data.students.reduce((max, student) => Math.max(max, student.id), 0);
      const newStudent = {
        id: maxId + 1,
        name,
        pin,
        balance: Number.isFinite(startingBalance) ? startingBalance : 0,
        frozen: false
      };

      data.students.push(newStudent);
      saveData();
      message = name + " added with a starting balance of " + dollars(newStudent.balance) + ".";
      render();
    }

    async function activateStudent(studentIdStr) {
      if (!requireTeacher()) return;
      const student = data.students.find(s => String(s.id) === studentIdStr);
      if (!student) return;

      const newPin = prompt(`Enter a new 4-digit PIN for ${student.name}:`);
      if (!newPin) return;
      if (!/^\d{4}$/.test(newPin)) {
        alert("PIN must be exactly 4 digits.");
        return;
      }

      message = `Activating account for ${student.name}...`;
      render();

      if (IS_MULTI_TEACHER_V2_ENABLED) {
        const captured = v2TenantSession.captureIdentity();
        const resetFn = async (p) => {
          const resetStudentPin = httpsCallable(functions, "resetStudentPinV2");
          return await resetStudentPin(p);
        };
        const payload = {
          studentId: String(student.id),
          newPin
        };
        const res = await orchestrateStudentPinReset(v2TenantSession, resetFn, payload);
        if (!v2TenantSession.validateCapturedIdentity(captured)) return;

        if (res.executed) {
          v2ActivatedStudentIds.add(String(student.id));
          rememberResetStudentPin(captured, student.id, newPin);
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = `Account activated for ${student.name}.`;
            render();
          }
        } else {
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = res.error
              ? `Failed to activate ${student.name}: ${res.error}`
              : `Failed to activate ${student.name}.`;
            render();
          }
        }
        return;
      }

      try {
        const resetStudentPin = httpsCallable(functions, "resetStudentPin");
        await resetStudentPin({
          classroomId: "morgan",
          studentId: String(student.id),
          newPin
        });
        student.credentialActive = true;
        saveData();
        message = `Account activated for ${student.name}.`;
      } catch (error) {
        console.error("Activation failed:", error);
        message = `Failed to activate ${student.name}: ${error.message}`;
      }
      render();
    }

    async function bulkActivateStudents() {
      if (!requireTeacher() || bulkOperationPending) return;
      const checkboxes = Array.from(document.querySelectorAll(".bulk-activate-check:checked"));
      if (checkboxes.length === 0) {
        alert("Please select at least one inactive student.");
        return;
      }

      const newPin = document.getElementById("bulkActivatePin")?.value ?? "";
      if (!/^\d{4}$/.test(newPin)) {
        alert("PIN must be exactly 4 digits.");
        return;
      }

      bulkOperationPending = true;
      message = `Activating ${checkboxes.length} accounts...`;
      render();

      if (IS_MULTI_TEACHER_V2_ENABLED) {
        const captured = v2TenantSession.captureIdentity();
        const bulkFn = async (p, cap) => {
          const resetStudentPin = httpsCallable(functions, "resetStudentPinV2");
          const successfulStudentIds = [];
          let failCount = 0;
          for (const cb of p.checkboxes) {
            if (!v2TenantSession.validateCapturedIdentity(cap)) break;
            const studentId = cb.value;
            const student = data.students.find(s => String(s.id) === studentId);
            if (student) {
              try {
                await resetStudentPin({
                  studentId: String(student.id),
                  newPin: p.newPin
                });
                if (v2TenantSession.validateCapturedIdentity(cap)) {
                  successfulStudentIds.push(String(student.id));
                }
              } catch (error) {
                console.error("Failed to activate student", student.name, error);
                failCount++;
              }
            }
          }
          return { successfulStudentIds, failCount };
        };

        const res = await orchestrateBulkOperation(v2TenantSession, bulkFn, { checkboxes, newPin });
        if (!v2TenantSession.validateCapturedIdentity(captured)) return;

        if (res.executed && res.result) {
          const { successfulStudentIds, failCount } = res.result;
          for (const sId of successfulStudentIds) {
            v2ActivatedStudentIds.add(sId);
            rememberResetStudentPin(captured, sId, newPin);
          }
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = `Bulk activation complete. ${successfulStudentIds.length} succeeded, ${failCount} failed.`;
            bulkOperationPending = false;
            render();
          }
        } else {
          if (v2TenantSession.validateCapturedIdentity(captured)) {
            message = res.error || "Bulk activation cancelled or session invalidated.";
            bulkOperationPending = false;
            render();
          }
        }
        return;
      }

      const resetStudentPin = httpsCallable(functions, "resetStudentPin");
      let successCount = 0;
      let failCount = 0;

      for (const cb of checkboxes) {
        const studentId = cb.value;
        const student = data.students.find(s => String(s.id) === studentId);
        if (student) {
          try {
            await resetStudentPin({
              classroomId: "morgan",
              studentId: String(student.id),
              newPin
            });
            student.credentialActive = true;
            successCount++;
          } catch (error) {
            console.error("Failed to activate student", student.name, error);
            failCount++;
          }
        }
      }

      saveData();
      message = `Bulk activation complete. ${successCount} succeeded, ${failCount} failed.`;
      render();
    }

    function importBackup(event) {
      if (!requireTeacher()) return;

      // Section 4: V2 backup import is disabled for the initial cutover because
      // a client-side import cannot atomically allocate server-owned student
      // numbers and credentials. The retained rollback path is schema-validated
      // below; re-enabling V2 still requires a separately tested import service.
      if (IS_MULTI_TEACHER_V2_ENABLED) {
        event.target.value = "";
        showMessage("Backup import is unavailable in this version.");
        return;
      }

      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        if (!requireTeacher()) return;

        try {
          const imported = JSON.parse(e.target.result);
          data = normalizeData(sanitizeLegacyBackup(imported, {
            fallbackLoginHistory: data.loginHistory || [],
            fallbackSettings: data.settings
          }));
        saveData();
        showMessage("Backup imported.");
        } catch {
          alert("Could not import that file.");
        }
      };
      reader.readAsText(file);
    }

    async function submitStudentMoneyV2(type, amount, reason) {
      if (studentMoneySubmissionPending) return;
      studentMoneySubmissionPending = true;
      message = type === "Add" ? "Submitting Add Money request..." : "Submitting payment...";
      render();

      const callableAdapter = async (functionName, payload) => {
        const callable = httpsCallable(functions, functionName);
        return await callable(payload);
      };
      const retryPayload = studentMoneyRetryPayload;
      const payload = retryPayload &&
        retryPayload.type === type &&
        retryPayload.amount === amount &&
        retryPayload.reason === reason
        ? retryPayload
        : Object.freeze({ transactionId: Date.now(), type, amount, reason });
      studentMoneyRetryPayload = payload;
      const result = await orchestrateStudentTransaction(
        v2TenantSession,
        callableAdapter,
        payload
      );
      if (result.reason === "stale-epoch-ignored") return;

      studentMoneySubmissionPending = false;
      if (!result.executed) {
        // An ID collision is definitive, not an ambiguous network outcome.
        // Discard it so the next otherwise-identical submission gets a fresh ID.
        if (result.rawCode === "already-exists") studentMoneyRetryPayload = null;
        message = result.error || "The transaction could not be completed.";
        render();
        return;
      }

      studentMoneyRetryPayload = null;
      applyConfirmedStudentTransaction(result.result);
      if (type === "Add") {
        const status = result.result.transaction.status;
        message = status === "Pending"
          ? "Add Money submitted for teacher approval."
          : `This Add Money request is already ${status.toLowerCase()}.`;
      } else {
        message = "Subtract Money submitted. Money has been subtracted.";
      }
      render();
    }

    function formatRememberedStudentClassroomCode(rawCode) {
      if (typeof rawCode !== "string") return "";
      const canonical = rawCode.trim().toUpperCase().replace(/[-\s]/g, "");
      if (!/^[2-9A-HJ-NP-Z]{8}$/.test(canonical)) return "";
      return `${canonical.slice(0, 4)}-${canonical.slice(4)}`;
    }

    // Make the first-login classroom locator easy to enter from a printed or
    // displayed code. Physical keyboards do not reliably honor autocapitalize,
    // so normalize allowed characters as the student types, insert the separator
    // after the fifth character, and apply the same behavior to pasted text.
    // This is presentation-only convenience: the callable still validates the
    // submitted code independently, and stored locators remain strict.
    function formatStudentClassroomCodeDraft(rawCode) {
      if (typeof rawCode !== "string") return "";
      const asciiUpper = rawCode.replace(
        /[a-z]/g,
        char => String.fromCharCode(char.charCodeAt(0) - 32)
      );
      const canonical = asciiUpper.replace(/[^2-9A-HJ-NP-Z]/g, "").slice(0, 8);
      if (canonical.length < 4) return canonical;
      if (canonical.length === 4) {
        return /[-\s]$/.test(rawCode) ? `${canonical}-` : canonical;
      }
      return `${canonical.slice(0, 4)}-${canonical.slice(4)}`;
    }

    // A classroom link is a non-secret locator only. Keep it in the fragment so
    // Hosting and other servers never receive it, accept exactly one reviewed
    // field, and never place a login ID, PIN, token, or student record in the URL.
    function readStudentClassroomCodeFromLink() {
      if (!IS_MULTI_TEACHER_V2_ENABLED) return "";
      let entries;
      try {
        entries = [...new URLSearchParams(window.location.hash.slice(1)).entries()];
      } catch {
        return "";
      }
      if (entries.length !== 1 || entries[0][0] !== "student-login") return "";
      const rawCode = entries[0][1];
      const code = formatRememberedStudentClassroomCode(rawCode);
      return code && code === rawCode ? code : "";
    }

    function studentClassroomLoginLink(rawCode) {
      const code = formatRememberedStudentClassroomCode(rawCode);
      if (!code || code !== rawCode) return "";
      const url = new URL(window.location.href);
      url.search = "";
      url.hash = new URLSearchParams({ "student-login": code }).toString();
      return url.toString();
    }

    function clearStudentClassroomCodeFromLink(rawCode) {
      const linkedCode = readStudentClassroomCodeFromLink();
      if (!linkedCode || linkedCode !== rawCode) return false;
      try {
        const url = new URL(window.location.href);
        url.hash = "";
        window.history.replaceState(window.history.state, "", url);
        return true;
      } catch {
        return false;
      }
    }

    function handleStudentClassroomCodeInput(event) {
      const input = event?.currentTarget;
      if (!input || typeof input.value !== "string") return;
      const formatted = formatStudentClassroomCodeDraft(input.value);
      input.value = formatted;
      studentClassroomCodeDraft = formatted;
    }

    // The superseded one-field convenience. Still read so a browser that only
    // ever stored a classroom code keeps that prefill until its next successful
    // login upgrades it to the combined locator. Nothing writes this key anymore.
    function readRememberedStudentClassroomCode() {
      if (!IS_MULTI_TEACHER_V2_ENABLED) return "";
      try {
        return formatRememberedStudentClassroomCode(
          localStorage.getItem(V2_STUDENT_CLASSROOM_CODE_STORAGE_KEY)
        );
      } catch {
        return "";
      }
    }

    // The canonical classroom-scoped login ID grammar the server allocates and
    // enforces: lowercase ASCII alphanumerics with single interior hyphens, 1-64
    // characters, no leading or trailing hyphen. This mirrors
    // normalizeStudentLoginId in functions/phase2b/identityNormalization.js and
    // the callable-response guard in src/phase2b/tenantClient.js. A stored value
    // is rejected rather than repaired: the browser must never assemble a login
    // identity the server did not issue.
    function canonicalStudentLoginId(rawLoginId) {
      if (typeof rawLoginId !== "string") return "";
      const canonical = rawLoginId
        .trim()
        .replace(/[A-Z]/g, char => String.fromCharCode(char.charCodeAt(0) + 32));
      if (canonical.length < 1 || canonical.length > 64) return "";
      if (!/^[a-z0-9-]+$/.test(canonical)) return "";
      if (canonical.startsWith("-") || canonical.endsWith("-")) return "";
      if (canonical.includes("--")) return "";
      return canonical;
    }

    // Exactly these two non-secret fields, so a returning student normally types
    // only the PIN. Any other shape is treated as corrupt.
    const V2_STUDENT_LOGIN_LOCATOR_FIELDS = ["classroomCode", "loginId"];

    function parseStudentLoginLocator(rawRecord) {
      if (typeof rawRecord !== "string" || !rawRecord) return null;
      let parsed;
      try {
        parsed = JSON.parse(rawRecord);
      } catch {
        return null;
      }
      if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return null;
      // An exact key set, so a record carrying a smuggled PIN, token, UID, or any
      // other extra field is refused outright instead of being partially trusted.
      if (Object.keys(parsed).length !== V2_STUDENT_LOGIN_LOCATOR_FIELDS.length) return null;
      for (const field of V2_STUDENT_LOGIN_LOCATOR_FIELDS) {
        if (!Object.prototype.hasOwnProperty.call(parsed, field)) return null;
        if (typeof parsed[field] !== "string") return null;
      }
      // Compare against the canonical forms rather than accepting whatever
      // normalization would produce: a padded, lowercase, or otherwise
      // noncanonical record was not written by this feature and must not be used
      // to build a login payload. Both canonicalizers return "" for a value they
      // reject, so each result must also be non-empty — otherwise a record whose
      // fields are already blank would compare equal to its own rejection and be
      // admitted as a valid locator.
      const classroomCode = formatRememberedStudentClassroomCode(parsed.classroomCode);
      const loginId = canonicalStudentLoginId(parsed.loginId);
      if (!classroomCode || classroomCode !== parsed.classroomCode) return null;
      if (!loginId || loginId !== parsed.loginId) return null;
      return { classroomCode, loginId };
    }

    function readStudentLoginLocator() {
      if (!IS_MULTI_TEACHER_V2_ENABLED) return null;
      let stored;
      try {
        stored = localStorage.getItem(V2_STUDENT_LOGIN_LOCATOR_STORAGE_KEY);
      } catch {
        return null;
      }
      if (stored === null) return null;
      const locator = parseStudentLoginLocator(stored);
      if (!locator) {
        // A malformed record can never become a login payload. Drop it so the
        // full form returns instead of re-reading the same corruption forever.
        try {
          localStorage.removeItem(V2_STUDENT_LOGIN_LOCATOR_STORAGE_KEY);
        } catch {
          // Best effort only; the full form is already the safe outcome.
        }
        return null;
      }
      return locator;
    }

    function rememberStudentLoginLocator(rawCode, rawLoginId) {
      if (!IS_MULTI_TEACHER_V2_ENABLED) return false;
      const classroomCode = formatRememberedStudentClassroomCode(rawCode);
      const loginId = canonicalStudentLoginId(rawLoginId);
      if (!classroomCode || !loginId) return false;
      try {
        localStorage.setItem(
          V2_STUDENT_LOGIN_LOCATOR_STORAGE_KEY,
          JSON.stringify({ classroomCode, loginId })
        );
      } catch {
        // Storage may be unavailable or ephemeral in private browsing. A
        // successful student sign-in must never fail because preference storage
        // is unavailable.
        return false;
      }
      // Only after the combined locator is durably written does the superseded
      // classroom-code-only key go away, so a failed upgrade still leaves the
      // older one-field convenience intact.
      try {
        localStorage.removeItem(V2_STUDENT_CLASSROOM_CODE_STORAGE_KEY);
      } catch {
        // A surviving legacy key is harmless: the locator takes precedence on read.
      }
      return true;
    }

    // Synchronous and local by contract: switching students forgets the locator
    // and restores the full form without signing anyone out, calling Firebase, or
    // disturbing any other stored teacher or student data.
    function useDifferentStudent() {
      if (studentLoginPending) return;
      const rememberedCode = studentLoginLocator ? studentLoginLocator.classroomCode : "";
      studentLoginLocator = null;
      studentLoginIdDraft = "";
      try {
        localStorage.removeItem(V2_STUDENT_LOGIN_LOCATOR_STORAGE_KEY);
      } catch {
        // The in-memory locator is already cleared and the full form is showing.
      }
      // The classroom code is a shared, non-secret room locator, so the usual
      // shared-device case ("same classroom, different student") keeps it in the
      // in-memory form draft only. Nothing new is persisted: the durable locator
      // is already gone, and the full form still requires all three values.
      studentClassroomCodeDraft = rememberedCode || readRememberedStudentClassroomCode();
      render();
    }

    function legacyCopyText(text) {
      const input = document.createElement("textarea");
      input.value = text;
      input.setAttribute("readonly", "");
      input.style.position = "fixed";
      input.style.opacity = "0";
      document.body.appendChild(input);
      input.select();
      input.setSelectionRange(0, input.value.length);
      let copied = false;
      try {
        copied = document.execCommand("copy") === true;
      } catch {
        copied = false;
      }
      input.remove();
      return copied;
    }

    async function copyTextWithFallback(text) {
      let copied = false;
      try {
        if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
          await navigator.clipboard.writeText(text);
          copied = true;
        }
      } catch {
        copied = false;
      }

      return copied || legacyCopyText(text);
    }

    function resetAllGlobalState() {

      // daily student login fast, while retaining no PIN, token, Auth UID, student

      dashboardMoneyTool = "quick";
      insightsPeriodDays = 30;
      resetProviderInsightsState();
      profileLoginIdStatus = "Checking...";

      // classroom switch, an invalidation, or a sign-out for even one render.
      v2StudentPins = new Map();
      v2StudentPinOverrides = new Map();
      v2StudentPinsIdentity = null;
      v2StudentPinsLoading = false;

      v2LastPersistedData = null;

      // must not inherit the previous teacher's "Active" badges.

    async function submitV2Onboarding() {
      const classroomName = document.getElementById("v2ClassroomName")?.value || "";
      if (!classroomName.trim()) {
        message = "Please enter a valid classroom name.";
        render();
        return;
      }
      message = "Creating classroom...";
      render();
      const callAdapter = async (name, payload) => {
        const callable = httpsCallable(functions, name);
        return await callable(payload);
      };
      const res = await orchestrateTeacherOnboarding(v2TenantSession, callAdapter, { classroomName });
      if (res.success && v2TenantSession.getState() === SESSION_STATES.ACTIVE) {
        const loadNetworkFn = async () => {
          const loaded = await v2LoadTenantData({
            uid: auth.currentUser?.uid,
            classroomId: v2TenantSession.classroomId
          });
          v2LastPersistedData = JSON.parse(JSON.stringify(loaded));
          return loaded;
        };
        const loadResult = await loadClassroomDataWithCacheFallback(v2TenantSession, {
          loadNetworkFn,
          storageAdapter: localStorage,
          projectId: v2TenantSession.projectId
        });
        if (
          loadResult.executed &&
          v2TenantSession.getState() === SESSION_STATES.READY
        ) {
          if (loadResult.data) data = loadResult.data;
          v2IsOffline = Boolean(loadResult.isOffline);
          message = res.created ? "Classroom created." : "Classroom ready.";
        }
      }
      if (message === "Creating classroom...") {
        message = res.error || "Classroom setup did not complete. Please try again.";
      }
      render();
    }

    async function manageTeacherInvitation(action) {
      if (
        !IS_MULTI_TEACHER_V2_ENABLED ||
        !requireTeacher() ||
        !isPlatformAdmin ||
        teacherInvitationPending ||
        (action !== "create" && action !== "revoke")
      ) {
        return;
      }

      const emailInput = document.getElementById("teacherInvitationEmail");
      const expiryInput = document.getElementById("teacherInvitationExpiryHours");
      const email = typeof emailInput?.value === "string" ? emailInput.value.trim() : "";
      const expiresInHours = Number(expiryInput?.value);

      if (!email) {
        message = "Enter the teacher's Google email address.";
        render();
        return;
      }
      if (
        action === "create" &&
        (!Number.isInteger(expiresInHours) || expiresInHours < 1 || expiresInHours > 168)
      ) {
        message = "Choose an invitation expiration between 1 and 168 hours.";
        render();
        return;
      }

      teacherInvitationEmailDraft = email;
      if (Number.isInteger(expiresInHours)) {
        teacherInvitationExpiryHours = expiresInHours;
      }
      teacherInvitationPending = true;
      message = action === "create" ? "Creating invitation..." : "Revoking invitation...";
      render();

      const callAdapter = async (name, payload) => {
        const callable = httpsCallable(functions, name);
        return await callable(payload);
      };
      const payload = action === "create"
        ? { email, expiresInHours: teacherInvitationExpiryHours }
        : { email };
      const result = await orchestrateTeacherInvitationAdmin(
        v2TenantSession,
        callAdapter,
        action,
        payload
      );

      if (result.reason === "stale-epoch-ignored") return;

      teacherInvitationPending = false;
      if (!result.executed) {
        message = result.error || "The invitation could not be changed.";
      } else if (action === "create") {
        message = result.result.created
          ? "Invitation created. The teacher can now sign in with Google."
          : "An active invitation already exists. Its expiration was not changed.";
      } else if (result.result.status === "not-found") {
        message = "No invitation was found for that email address.";
      } else {
        message = result.result.revoked
          ? "Invitation revoked."
          : "The invitation was already revoked.";
      }
      render();
    }
