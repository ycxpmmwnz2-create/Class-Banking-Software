<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mr. Morgan's Class Cash</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background-color: #f1f5f9;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: #0f172a;
      box-sizing: border-box;
    }
    * { box-sizing: border-box; }
    h1 { margin-top: 0; }
    .message {
      background-color: #e0f2fe;
      padding: 12px;
      border-radius: 10px;
      font-weight: bold;
    }
    .button-bar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    button {
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #cbd5e1;
      background-color: white;
      cursor: pointer;
    }
    .primary {
      border: 0;
      background-color: #0f172a;
      color: white;
      margin-top: 8px;
    }
    .danger {
      border: 0;
      background-color: #dc2626;
      color: white;
      margin-left: 6px;
    }
    .approve {
      border: 0;
      background-color: #16a34a;
      color: white;
    }
    .stats {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }
    .stat-box {
      background-color: white;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #e2e8f0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 16px;
    }
    .card {
      background-color: white;
      padding: 18px;
      border-radius: 14px;
      border: 1px solid #e2e8f0;
      overflow-x: auto;
    }
    input, select {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
    }
    .login-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      background-color: #f8fafc;
      padding: 8px;
      border-radius: 12px;
      margin-bottom: 16px;
    }
    .active-tab {
      border: 0;
      background-color: #0f172a;
      color: white;
      font-weight: bold;
    }
    .inactive-tab {
      background-color: white;
      font-weight: bold;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 700px;
    }
    th {
      text-align: left;
      padding: 8px;
      background-color: #f8fafc;
      border-bottom: 1px solid #e2e8f0;
    }
    td {
      padding: 8px;
      border-bottom: 1px solid #e2e8f0;
    }
    .roster-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 10px;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      margin-bottom: 8px;
      flex-wrap: wrap;
    }
    .big-balance {
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 10px;
    }
    .pending-balance {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .small-note {
      font-size: 13px;
      color: #475569;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <script>
    const teacherPassword = "Morgan123";
    const STORAGE_KEY = "mrMorganClassCashData";

    const startingStudents = [
      { id: 1, name: "Isaac", balance: 125, pin: "1001" },
      { id: 2, name: "Pankti", balance: 140, pin: "1002" },
      { id: 3, name: "Manuel", balance: 95, pin: "1003" },
      { id: 4, name: "Abigail", balance: 160, pin: "1004" }
    ];

    const startingTransactions = [
      {
        id: 1,
        studentId: 1,
        studentName: "Isaac",
        type: "Add",
        amount: 25,
        reason: "Weekly payday",
        status: "Approved",
        source: "Teacher"
      },
      {
        id: 2,
        studentId: 2,
        studentName: "Pankti",
        type: "Subtract",
        amount: 5,
        reason: "Store purchase",
        status: "Pending",
        source: "Student"
      }
    ];

    let state = {
      students: startingStudents,
      transactions: startingTransactions,
      screen: "login",
      loginTab: "student",
      isTeacher: false,
      loggedInStudentId: null,
      message: "Choose Student Login or Teacher Login.",
      teacherInput: "",
      studentSelect: 1,
      studentPin: "",
      selectedStudent: "whole",
      type: "Add",
      amount: "10",
      reason: "Weekly payday",
      newStudentName: "",
      newStudentPin: "",
      newStudentBalance: "100"
    };

    function loadData() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (!saved) return;
      try {
        const parsed = JSON.parse(saved);
        if (parsed.students && parsed.transactions) {
          state.students = parsed.students;
          state.transactions = parsed.transactions;
          if (state.students.length > 0) {
            state.studentSelect = state.students[0].id;
          }
        }
      } catch (error) {
        console.error("Could not load saved data:", error);
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        students: state.students,
        transactions: state.transactions
      }));
    }

    function dollars(amount) {
      return "$" + Number(amount).toLocaleString();
    }

    function setState(updates, shouldSave = false) {
      state = { ...state, ...updates };
      if (shouldSave) saveData();
      render();
    }

    function currentStudent() {
      return state.students.find(student => student.id === state.loggedInStudentId);
    }

    function loginTeacher() {
      if (state.teacherInput === teacherPassword) {
        setState({
          isTeacher: true,
          loggedInStudentId: null,
          screen: "teacher",
          message: "Teacher dashboard unlocked."
        });
      } else {
        setState({ message: "Wrong teacher password." });
      }
    }

    function loginStudent() {
      const student = state.students.find(item => item.id === Number(state.studentSelect));
      if (student && student.pin === state.studentPin) {
        setState({
          isTeacher: false,
          loggedInStudentId: student.id,
          screen: "student",
          message: student.name + " is logged in."
        });
      } else {
        setState({ message: "Wrong student PIN." });
      }
    }

    function logout() {
      setState({
        isTeacher: false,
        loggedInStudentId: null,
        teacherInput: "",
        studentPin: "",
        screen: "login",
        message: "Logged out. Choose Student Login or Teacher Login."
      });
    }

    function changeStudentBalance(studentId, transactionType, transactionAmount) {
      state.students = state.students.map(student => {
        if (student.id !== studentId) return student;
        const newBalance = transactionType === "Add"
          ? student.balance + transactionAmount
          : student.balance - transactionAmount;
        return { ...student, balance: newBalance };
      });
    }

    function saveTeacherTransaction() {
      const transactionAmount = Number(state.amount);
      if (!transactionAmount || transactionAmount <= 0) return;

      const targetStudents = state.selectedStudent === "whole"
        ? state.students
        : state.students.filter(student => student.id === Number(state.selectedStudent));

      targetStudents.forEach(student => {
        changeStudentBalance(student.id, state.type, transactionAmount);
      });

      const newTransactions = targetStudents.map((student, index) => ({
        id: Date.now() + index,
        studentId: student.id,
        studentName: student.name,
        type: state.type,
        amount: transactionAmount,
        reason: state.reason,
        status: "Approved",
        source: "Teacher"
      }));

      state.transactions = newTransactions.concat(state.transactions);
      state.message = "Transaction saved.";
      saveData();
      render();
    }

    function submitStudentRequest() {
      const student = currentStudent();
      if (!student) return;

      const transactionAmount = Number(state.amount);
      if (!transactionAmount || transactionAmount <= 0) return;

      const newTransaction = {
        id: Date.now(),
        studentId: student.id,
        studentName: student.name,
        type: state.type,
        amount: transactionAmount,
        reason: state.reason,
        status: "Pending",
        source: "Student"
      };

      state.transactions = [newTransaction].concat(state.transactions);
      state.message = "Request submitted for teacher approval.";
      saveData();
      render();
    }

    function approveTransaction(transactionId) {
      const transaction = state.transactions.find(item => item.id === transactionId);
      if (!transaction || transaction.status !== "Pending") return;

      changeStudentBalance(transaction.studentId, transaction.type, transaction.amount);

      state.transactions = state.transactions.map(item => {
        if (item.id === transactionId) {
          return { ...item, status: "Approved" };
        }
        return item;
      });

      state.message = "Transaction approved.";
      saveData();
      render();
    }

    function denyTransaction(transactionId) {
      state.transactions = state.transactions.map(item => {
        if (item.id === transactionId) {
          return { ...item, status: "Denied" };
        }
        return item;
      });

      state.message = "Transaction denied.";
      saveData();
      render();
    }

    function addStudent() {
      if (state.newStudentName.trim() === "") return;

      const maxId = state.students.reduce((max, student) => Math.max(max, student.id), 0);
      const newId = maxId + 1;

      const newStudent = {
        id: newId,
        name: state.newStudentName.trim(),
        pin: state.newStudentPin || String(1000 + newId),
        balance: Number(state.newStudentBalance) || 0
      };

      state.students = state.students.concat([newStudent]);
      state.newStudentName = "";
      state.newStudentPin = "";
      state.newStudentBalance = "100";
      state.studentSelect = state.students[0]?.id || newId;
      state.message = "Student added.";
      saveData();
      render();
    }

    function removeStudent(studentId) {
      const student = state.students.find(s => s.id === studentId);
      if (!student) return;

      const confirmed = confirm("Remove " + student.name + "? This will keep old transactions but remove the student from the roster.");
      if (!confirmed) return;

      state.students = state.students.filter(student => student.id !== studentId);
      if (state.studentSelect === studentId && state.students.length > 0) {
        state.studentSelect = state.students[0].id;
      }
      state.message = "Student removed.";
      saveData();
      render();
    }

    function resetDemo() {
      const confirmed = confirm("Reset all demo data? This will erase saved students, balances, and transactions in this browser.");
      if (!confirmed) return;

      state.students = [...startingStudents];
      state.transactions = [...startingTransactions];
      state.screen = "login";
      state.isTeacher = false;
      state.loggedInStudentId = null;
      state.message = "Demo reset. Choose Student Login or Teacher Login.";
      state.studentSelect = 1;
      saveData();
      render();
    }

    function exportBackup() {
      const data = {
        students: state.students,
        transactions: state.transactions,
        exportedAt: new Date().toISOString()
      };
      const blob = new Blob([JSON.stringify(data, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = "class-bank-backup.json";
      link.click();
      URL.revokeObjectURL(url);
    }

    function importBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const data = JSON.parse(e.target.result);
          if (!Array.isArray(data.students) || !Array.isArray(data.transactions)) {
            alert("That backup file does not look right.");
            return;
          }
          state.students = data.students;
          state.transactions = data.transactions;
          state.studentSelect = state.students[0]?.id || "";
          state.message = "Backup imported.";
          saveData();
          render();
        } catch (error) {
          alert("Could not import that file.");
        }
      };
      reader.readAsText(file);
    }

    function transactionTable(transactions, showActions) {
      if (!transactions || transactions.length === 0) {
        return "<p>No transactions yet.</p>";
      }

      const rows = transactions.map(transaction => `
        <tr>
          <td>${transaction.studentName}</td>
          <td>${transaction.type}</td>
          <td>${dollars(transaction.amount)}</td>
          <td>${transaction.reason}</td>
          <td>${transaction.source}</td>
          <td>${transaction.status}</td>
          <td>
            ${showActions && transaction.status === "Pending"
              ? `<button class="approve" onclick="approveTransaction(${transaction.id})">Approve</button>
                 <button class="danger" onclick="denyTransaction(${transaction.id})">Deny</button>`
              : "—"}
          </td>
        </tr>
      `).join("");

      return `
        <table>
          <thead>
            <tr>
              <th>Student</th>
              <th>Type</th>
              <th>Amount</th>
              <th>Reason</th>
              <th>Source</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      `;
    }

    function render() {
      const student = currentStudent();
      const totalCash = state.students.reduce((total, student) => total + student.balance, 0);
      const pendingTransactions = state.transactions.filter(transaction => transaction.status === "Pending");
      const studentTransactions = student
        ? state.transactions.filter(transaction => transaction.studentId === student.id)
        : [];

      const pendingChange = studentTransactions.reduce((total, transaction) => {
        if (transaction.status !== "Pending") return total;
        return transaction.type === "Add" ? total + transaction.amount : total - transaction.amount;
      }, 0);

      const studentOptions = state.students.map(student =>
        `<option value="${student.id}" ${Number(state.studentSelect) === student.id ? "selected" : ""}>${student.name}</option>`
      ).join("");

      let content = `
        <h1>Mr. Morgan's Class Cash</h1>
        <p class="message">${state.message}</p>

        <div class="button-bar">
          <button onclick="setState({ screen: 'login' })">Home/Login</button>
          ${state.isTeacher ? `<button onclick="setState({ screen: 'teacher' })">Teacher Dashboard</button>` : ""}
          ${state.isTeacher ? `<button onclick="setState({ screen: 'approvals' })">Approvals</button>` : ""}
          ${state.isTeacher ? `<button onclick="setState({ screen: 'roster' })">Roster</button>` : ""}
          ${state.loggedInStudentId ? `<button onclick="setState({ screen: 'student' })">Student View</button>` : ""}
          <button onclick="logout()">Lock</button>
          <button onclick="resetDemo()">Reset</button>
        </div>

        <div class="stats">
          <div class="stat-box">Students: ${state.students.length}</div>
          <div class="stat-box">Total Cash: ${dollars(totalCash)}</div>
          <div class="stat-box">Pending: ${pendingTransactions.length}</div>
        </div>
      `;

      if (state.screen === "login") {
        content += `
          <div class="card">
            <div class="login-tabs">
              <button class="${state.loginTab === "student" ? "active-tab" : "inactive-tab"}" onclick="setState({ loginTab: 'student' })">Student Login</button>
              <button class="${state.loginTab === "teacher" ? "active-tab" : "inactive-tab"}" onclick="setState({ loginTab: 'teacher' })">Teacher Login</button>
            </div>

            ${state.loginTab === "student" ? `
              <h2>Student Login</h2>
              <select onchange="setState({ studentSelect: Number(this.value) })">${studentOptions}</select>
              <input type="password" value="${state.studentPin}" oninput="setState({ studentPin: this.value })" placeholder="PIN / nine number" />
              <button class="primary" onclick="loginStudent()">Login as Student</button>
            ` : `
              <h2>Teacher Login</h2>
              <input type="password" value="${state.teacherInput}" oninput="setState({ teacherInput: this.value })" placeholder="Teacher password" />
              <button class="primary" onclick="loginTeacher()">Login as Teacher</button>
            `}
          </div>
        `;
      }

      if (state.screen === "teacher" && state.isTeacher) {
        const targetOptions = `
          <option value="whole" ${state.selectedStudent === "whole" ? "selected" : ""}>Whole Class</option>
          ${state.students.map(student => `<option value="${student.id}" ${Number(state.selectedStudent) === student.id ? "selected" : ""}>${student.name}</option>`).join("")}
        `;

        content += `
          <div class="grid">
            <div class="card">
              <h2>Add or Subtract Money</h2>
              <select onchange="setState({ selectedStudent: this.value })">${targetOptions}</select>
              <select onchange="setState({ type: this.value })">
                <option value="Add" ${state.type === "Add" ? "selected" : ""}>Add</option>
                <option value="Subtract" ${state.type === "Subtract" ? "selected" : ""}>Subtract</option>
              </select>
              <input type="number" value="${state.amount}" oninput="setState({ amount: this.value })" />
              <select onchange="setState({ reason: this.value })">
                ${["Weekly payday", "Class job", "Showing work", "Desk rent", "Bathroom break", "Store purchase", "Bonus"].map(reason =>
                  `<option value="${reason}" ${state.reason === reason ? "selected" : ""}>${reason}</option>`
                ).join("")}
              </select>
              <button class="primary" onclick="saveTeacherTransaction()">Save Approved Transaction</button>
            </div>

            <div class="card">
              <h2>All Transactions</h2>
              ${transactionTable(state.transactions, true)}
            </div>
          </div>
        `;
      }

      if (state.screen === "approvals" && state.isTeacher) {
        content += `
          <div class="card">
            <h2>Pending Approvals</h2>
            ${transactionTable(pendingTransactions, true)}
          </div>
        `;
      }

      if (state.screen === "roster" && state.isTeacher) {
        content += `
          <div class="grid">
            <div class="card">
              <h2>Add Student</h2>
              <input value="${state.newStudentName}" oninput="setState({ newStudentName: this.value })" placeholder="Student name" />
              <input value="${state.newStudentPin}" oninput="setState({ newStudentPin: this.value })" placeholder="PIN / nine number" />
              <input type="number" value="${state.newStudentBalance}" oninput="setState({ newStudentBalance: this.value })" placeholder="Starting balance" />
              <button class="primary" onclick="addStudent()">Add Student</button>

              <h2>Backup</h2>
              <button onclick="exportBackup()">Export Backup</button>
              <input type="file" accept=".json" onchange="importBackup(event)" />
              <p class="small-note">This app saves to this browser using localStorage. Export backups often.</p>
            </div>

            <div class="card">
              <h2>Roster</h2>
              ${state.students.map(student => `
                <div class="roster-row">
                  <span>${student.name} — ${dollars(student.balance)} — PIN: ${student.pin}</span>
                  <button class="danger" onclick="removeStudent(${student.id})">Remove</button>
                </div>
              `).join("")}
            </div>
          </div>
        `;
      }

      if (state.screen === "student" && student) {
        content += `
          <div class="grid">
            <div class="card">
              <h2>${student.name}'s Account</h2>
              <div class="big-balance">Approved Balance: ${dollars(student.balance)}</div>
              <div class="pending-balance">Pending Change: ${pendingChange >= 0 ? "+" : ""}${dollars(pendingChange)}</div>
              <div class="pending-balance">Pending Total: ${dollars(student.balance + pendingChange)}</div>

              <h3>Submit Request</h3>
              <select onchange="setState({ type: this.value })">
                <option value="Add" ${state.type === "Add" ? "selected" : ""}>Add</option>
                <option value="Subtract" ${state.type === "Subtract" ? "selected" : ""}>Subtract</option>
              </select>
              <input type="number" value="${state.amount}" oninput="setState({ amount: this.value })" />
              <select onchange="setState({ reason: this.value })">
                ${["Class job", "Showing work", "Store purchase", "Bathroom break", "Bonus"].map(reason =>
                  `<option value="${reason}" ${state.reason === reason ? "selected" : ""}>${reason}</option>`
                ).join("")}
              </select>
              <button class="primary" onclick="submitStudentRequest()">Submit Pending Request</button>
            </div>

            <div class="card">
              <h2>My Transactions</h2>
              ${transactionTable(studentTransactions, false)}
            </div>
          </div>
        `;
      }

      document.getElementById("app").innerHTML = content;
    }

    loadData();
    render();
  </script>
</body>
</html>
